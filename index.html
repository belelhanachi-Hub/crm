<style>
/* =====================================================================
   Facturation BF Conseil - DA BF Conseil (papier, noir, beige #E9E6DF, Tenorite)
   ===================================================================== */
:root{
  --ink:#151515; --ink2:#484845; --ink3:#7d7d78; --line:#e3e3df; --line2:#cdcdc7;
  --paper:#fff; --bg:#f3f3f0; --soft:#f7f7f4; --beige:#E9E6DF; --beige2:#d9d4c9; --beige3:#f4f2ed;
  --acc:#1f4fd1; --ok:#1c7a4a; --okb:#e8f4ed; --warn:#9a520a; --warnb:#fdf3e4; --err:#a8262f; --errb:#fbeceb;
  --r:3px;
  --f:"Tenorite","Segoe UI",Calibri,Arial,sans-serif;
  --fd:"Tenorite Display","Tenorite","Segoe UI",Calibri,Arial,sans-serif;
  --top:62px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f);font-size:15.5px;line-height:1.5;color:var(--ink);background:var(--bg)}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.ico{width:1em;height:1em;flex:none;vertical-align:-.13em}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muet{color:var(--ink3)}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:1.5px solid var(--ink);
  background:var(--paper);color:var(--ink);font-weight:700;font-size:14.5px;border-radius:var(--r);text-decoration:none;line-height:1.2;text-align:center;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#333}
.btn.beige{background:var(--beige);border-color:var(--beige2)}
.btn.beige:hover{background:var(--beige2)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--errb)}
.btn.petit{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.lien{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14px;text-align:left}
.lien:hover{color:var(--acc)}
.lien.danger{color:var(--err)}
.ico-btn{background:none;border:1px solid transparent;border-radius:var(--r);padding:3px 5px;line-height:1;color:var(--ink3)}
.ico-btn:hover{border-color:var(--line2);color:var(--ink);background:#fff}
.barre-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- Barre haute ---------- */
.topbar{position:sticky;top:0;z-index:40;height:var(--top);background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px}
.topbar .logo{height:42px;width:auto;display:block;filter:brightness(1.04)}
.tb-t{border-left:1px solid var(--line);padding-left:16px;font-size:12.5px;color:var(--ink2);line-height:1.3;min-width:0}
.tb-t b{display:block;color:var(--ink);font-size:15px;white-space:nowrap}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.save{font-size:12px;color:var(--ink3);white-space:nowrap}
.save.ok{color:var(--ok)}
.sauv{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.sauv .etat{color:var(--ink3)}
.sauv .etat.alerte{color:var(--warn);font-weight:700}
.en-ligne .save{display:none}
table.cal .jc{display:none}
.menu-btn{display:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:var(--r);padding:7px 10px;font-size:13px;font-weight:700}

/* ---------- Mise en page ---------- */
.layout{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100vh - var(--top))}
.nav{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;background:var(--paper);border-right:1px solid var(--line);
  padding:18px 12px 18px;display:flex;flex-direction:column;gap:2px}
.n-h{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:14px 13px 6px}
.n-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;padding:8px 10px;font-size:14.5px;color:var(--ink2);line-height:1.3}
.n-item:hover{background:var(--soft);color:var(--ink)}
.n-item.on{border-left-color:var(--ink);background:var(--soft);color:var(--ink);font-weight:700}
.n-item .ico{color:var(--ink3);font-size:16px}
.n-item.on .ico{color:var(--ink)}
.n-badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--ink);color:#fff;border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums}
.n-badge.alerte{background:var(--err)}
.n-foot{margin-top:auto;padding:20px 13px 0;font-size:12px;color:var(--ink3);line-height:1.5}
.n-foot .lien{font-size:12.5px;display:block;margin-bottom:6px}
.voile{display:none}
.main{padding:28px 36px 70px;min-width:0}
.page{max-width:1180px;margin:0 auto}
.page.etroite{max-width:920px}
h1.p-titre{font-family:var(--fd);font-weight:400;font-size:36px;margin:4px 0 8px;letter-spacing:-.01em;line-height:1.1}
.p-sous{font-size:15.5px;color:var(--ink2);margin-bottom:22px;max-width:780px}
.p-tete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.p-tete .p-sous{margin-bottom:0}

/* ---------- Blocs ---------- */
.bloc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.bloc.beige{background:var(--beige3);border-color:var(--beige2)}
.bloc h2{font-size:17px;margin-bottom:12px}
.bloc h2 .muet{font-weight:400;font-size:14px}
.bloc-tete{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.bloc-tete h2{margin:0}
.grille2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grille3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.enc{border-left:3px solid var(--ink);background:var(--soft);padding:12px 16px;margin:0 0 16px;font-size:14.5px;color:var(--ink2)}
.enc.alerte{border-left-color:var(--warn);background:var(--warnb)}
.enc.erreur{border-left-color:var(--err);background:var(--errb)}
.enc.ok{border-left-color:var(--ok);background:var(--okb)}
.enc b{color:var(--ink)}
.vide{padding:26px;text-align:center;color:var(--ink3);font-size:14.5px}

/* ---------- Indicateurs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .l{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.kpi .v{font-size:27px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:13px;color:var(--ink2)}
.kpi.noir{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.noir .l,.kpi.noir .s{color:#cfcfca}
.kpi.beige{background:var(--beige);border-color:var(--beige2)}
.kpi.alerte .v{color:var(--err)}

/* ---------- Formulaires ---------- */
.champ{display:block;margin-bottom:12px}
.champ>span{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.champ>span i{font-style:normal;font-weight:400;color:var(--ink3)}
.in,select.in,textarea.in{width:100%;padding:9px 11px;border:1.5px solid var(--line2);border-radius:var(--r);background:#fff;font-size:15px}
.in:focus{outline:none;border-color:var(--ink)}
textarea.in{resize:vertical;min-height:42px;line-height:1.45}
.in.nb{text-align:right;font-variant-numeric:tabular-nums}
.in[readonly],.in:disabled{background:var(--soft);color:var(--ink2)}
.aide{font-size:12.5px;color:var(--ink3);margin-top:4px}
.ligne-champs{display:grid;gap:12px}
.ligne-champs.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ligne-champs.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ligne-champs.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.case{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
.case input{width:17px;height:17px;accent-color:var(--ink)}
.filtres{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filtres .champ{margin:0;min-width:150px}

/* ---------- Tableaux ---------- */
.tab-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.t th{background:var(--beige);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--beige2)}
table.t tbody tr:hover{background:var(--soft)}
table.t tr.total td{font-weight:700;border-top:2px solid var(--ink);background:var(--beige3)}
table.t td.act{text-align:right;white-space:nowrap}
table.t tr.clic{cursor:pointer}
table.edit td{padding:5px 6px}
table.edit .in{padding:6px 8px;font-size:14px}

/* ---------- Statuts ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px;white-space:nowrap;border:1px solid transparent}
.st-brouillon{background:#fff;border-color:var(--line2);color:var(--ink2)}
.st-emise{background:var(--beige);border-color:var(--beige2);color:var(--ink)}
.st-envoyee{background:var(--ink);color:#fff}
.st-payee{background:var(--okb);border-color:#bfe0cc;color:var(--ok)}
.st-retard{background:var(--errb);border-color:#efc9c6;color:var(--err)}
.st-annulee{background:#fff;border-color:var(--line2);color:var(--ink3);text-decoration:line-through}
.st-histo{background:var(--soft);border-color:var(--line);color:var(--ink3)}

/* ---------- Onglets ---------- */
.onglets{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1.5px solid var(--ink);margin-bottom:16px}
.onglet{background:none;border:1px solid transparent;border-bottom:0;padding:8px 13px;font-size:14px;color:var(--ink2);border-radius:var(--r) var(--r) 0 0;margin-bottom:-1.5px}
.onglet:hover{color:var(--ink);background:var(--soft)}
.onglet.on{background:var(--ink);color:#fff;font-weight:700}
.onglet small{display:block;font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}

/* ---------- Planning ---------- */
.pl-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.pl-cote{position:sticky;top:calc(var(--top) + 14px)}
table.cal{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
table.cal th{background:var(--beige);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:7px 8px;text-align:left;border-bottom:1px solid var(--beige2)}
table.cal td{border-bottom:1px solid var(--line);padding:3px 6px;vertical-align:middle}
table.cal td.j{width:118px;font-size:13.5px;white-space:nowrap}
table.cal td.j b{display:inline-block;min-width:22px;font-variant-numeric:tabular-nums}
table.cal tr.we td{background:var(--soft)}
table.cal tr.we td.j{color:var(--ink3)}
table.cal tr.auj td.j{box-shadow:inset 3px 0 0 var(--ink)}
.demi{display:flex;align-items:center;gap:5px}
.demi select{flex:1;min-width:0;padding:5px 6px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;font-size:13.5px}
.demi select.code{font-weight:700}
.demi .h{font-size:12px;color:var(--ink3);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.demi .h.mod{color:var(--ink);font-weight:700}
.demi .ico-btn.note{color:var(--warn)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.pastille{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.recap-mois td,.recap-mois th{padding:6px 8px}

/* ---------- Factures ---------- */
.fac-tete{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.fac-num{font-family:var(--fd);font-size:32px;line-height:1.1}
.fac-grille{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.lignes td.lib{min-width:260px}
.lignes td.q{width:96px}
.lignes td.u{width:110px}
.lignes td.pu{width:110px}
.lignes td.m{width:120px}
.totaux{display:flex;justify-content:flex-end;margin-top:10px}
.totaux table{min-width:320px;border-collapse:collapse}
.totaux td{padding:7px 12px;font-size:14.5px}
.totaux tr.tt td{background:var(--ink);color:#fff;font-weight:700;font-size:17px}
.verrou{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink2)}
.cartes-mois{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.carte{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.carte h3{font-size:15px;margin-bottom:4px}
.carte .m{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0}

/* ---------- Statistiques ---------- */
.graph{width:100%;height:auto;display:block}
.graph text{font-family:var(--f);fill:var(--ink2);font-size:11px}
.legende{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}
.barre-h{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:7px}
.barre-h .b{height:14px;background:var(--beige);position:relative}
.barre-h .b i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.evol.pos{color:var(--ok)}
.evol.neg{color:var(--err)}
.jauge{height:12px;background:var(--line);position:relative;margin:8px 0 6px}
.jauge i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.jauge s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--err)}

/* ---------- Fenêtres ---------- */
.modal-fond{position:fixed;inset:0;background:rgba(21,21,21,.42);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.modal{background:#fff;border-radius:var(--r);max-width:560px;width:100%;padding:24px 26px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal.large{max-width:980px}
.modal h2{font-family:var(--fd);font-weight:400;font-size:26px;margin-bottom:10px}
.modal p{color:var(--ink2);margin-bottom:12px;font-size:14.5px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.apercu-pdf{width:100%;height:72vh;border:1px solid var(--line);background:var(--soft)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r);
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Écran étroit ---------- */
@media (max-width:1100px){
  .pl-wrap{grid-template-columns:1fr}
  .pl-cote{position:static}
  .fac-grille{grid-template-columns:1fr}
}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .menu-btn{display:inline-block}
  .nav{position:fixed;left:0;top:var(--top);bottom:0;width:282px;z-index:60;transform:translateX(-100%);transition:transform .2s;height:auto}
  .nav.open{transform:none}
  .voile.on{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(0,0,0,.3);z-index:50}
  .main{padding:22px 16px 60px}
  .tb-t{display:none}
}
@media (max-width:760px){
  table.lignes thead{display:none}
  table.lignes, table.lignes tbody, table.lignes tr, table.lignes td{display:block;width:100%}
  table.lignes tr{border:1px solid var(--line2);border-radius:var(--r);margin-bottom:10px;padding:8px;position:relative}
  table.lignes td{border:0;padding:4px 0}
  table.lignes td.q, table.lignes td.u, table.lignes td.pu{display:inline-block;width:32%;vertical-align:top}
  table.lignes td.m{text-align:right}
  .lignes td.lib{min-width:0}
  table.cal td.j{width:auto}
  .demi .h{min-width:30px}
  .grille2,.grille3,.ligne-champs.c2,.ligne-champs.c3,.ligne-champs.c4{grid-template-columns:1fr}
  h1.p-titre{font-size:29px}
  .sauv .etat{display:none}
  .en-ligne .sauv .etat{display:inline-block;white-space:normal;text-align:right;max-width:180px;font-size:11.5px;line-height:1.25}
  .bloc{padding:16px 14px}
  .totaux table{min-width:0;width:100%}
  .totaux td{padding:7px 8px}
  .totaux td:first-child{white-space:nowrap}
  .totaux td.num.muet{white-space:normal;font-size:13px}
  /* calendrier : tient dans la largeur du téléphone */
  table.cal{table-layout:fixed}
  table.cal th:first-child{width:58px}
  table.cal th{padding:7px 4px}
  table.cal td{padding:3px 2px}
  table.cal td.j{font-size:12.5px;white-space:normal;line-height:1.15}
  table.cal td.j b{min-width:18px}
  table.cal .jl{display:none}
  table.cal .jc{display:inline}
  .demi{gap:1px}
  .demi select{width:100%;padding:5px 2px;font-size:12.5px}
  .demi .ico-btn{padding:3px 2px}
  .demi .h{min-width:0;font-size:11px}
  /* tableaux sans en-tête (tableau de bord) : lignes empilées */
  .bloc > table.t:not(:has(thead)), .bloc > table.t:not(:has(thead)) tbody{display:block;width:100%}
  .bloc > table.t:not(:has(thead)) tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .bloc > table.t:not(:has(thead)) td{display:block;border:0;padding:0}
  .bloc > table.t:not(:has(thead)) td:not(.num):not(.act){flex:1 1 100%}
  .bloc > table.t:not(:has(thead)) td.act{margin-left:auto;white-space:normal}
  /* listes de factures et de paiements : une carte par facture */
  table.mob-fac thead, table.mob-pai thead{display:none}
  table.mob-fac, table.mob-fac tbody, table.mob-pai, table.mob-pai tbody{display:block;width:100%}
  table.mob-fac tr, table.mob-pai tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.mob-fac td, table.mob-pai td{display:block;border:0;padding:0;white-space:normal}
  table.mob-fac tr:not(.total) td:nth-child(1){grid-area:1/1}
  table.mob-fac tr:not(.total) td:nth-child(5){grid-area:1/2;font-weight:700}
  table.mob-fac tr:not(.total) td:nth-child(3){grid-area:2/1/3/3}
  table.mob-fac tr:not(.total) td:nth-child(4){grid-area:3/1;color:var(--ink3);font-size:13px}
  table.mob-fac tr:not(.total) td:nth-child(6){grid-area:3/2}
  table.mob-fac tr:not(.total) td:nth-child(2), table.mob-fac td.act{display:none}
  table.mob-fac tr.total td:empty{display:none}
  table.mob-pai tr td:nth-child(1){grid-area:1/1}
  table.mob-pai tr td:nth-child(6){grid-area:1/2}
  table.mob-pai tr td:nth-child(2){grid-area:2/1/3/3}
  table.mob-pai tr td:nth-child(4){grid-area:3/1;color:var(--ink3);font-size:13px}
  table.mob-pai tr td:nth-child(4)::before{content:"Échéance "}
  table.mob-pai tr td:nth-child(7){grid-area:3/2}
  table.mob-pai tr td:nth-child(8){grid-area:4/1/5/3;margin-top:6px}
  table.mob-pai tr td:nth-child(3), table.mob-pai tr td:nth-child(5){display:none}
  table.mob-pai tr td.vide{grid-area:1/1/2/3}
}
/* Planning de toute l'année (écran et impression A4 paysage) */
.onglet-an{font-weight:700}
.pa-actions{margin-bottom:14px}
.pa-actions .aide{margin:0}
.pa-etat{font-size:13px;font-weight:700;color:var(--warn)}
.pa-etat .lien{margin-left:8px;font-weight:400}
.pa-zone{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pa-tete{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.pa-tete img{height:46px;width:auto;filter:brightness(1.04)}
.pa-tete h2{font-family:var(--fd);font-size:22px;font-weight:400;line-height:1.1}
.pa-tete p{font-size:13px;color:var(--ink2);margin-top:3px}
.pa-tete .pa-date{margin-left:auto;align-self:flex-end;font-size:12px;color:var(--ink3)}
.pa-wrap{border:0}
table.pa{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed;background:#fff}
table.pa th{background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 2px;text-align:center;border:1px solid var(--ink)}
table.pa th.pa-n,table.pa td.pa-n{width:26px}
table.pa td{border:1px solid var(--line);padding:1px 2px;vertical-align:middle}
table.pa td.pa-n{text-align:center;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;background:var(--beige3)}
table.pa td.pa-c.we{background:var(--soft)}
table.pa td.pa-c.auj{box-shadow:inset 0 0 0 2px var(--ink)}
table.pa td.pa-c[data-act]{cursor:pointer}
table.pa td.pa-c[data-act]:hover{background:var(--beige)}
table.pa td.pa-x{background:repeating-linear-gradient(135deg,var(--beige3) 0 3px,#fff 3px 6px)}
.pa-in{display:grid;grid-template-columns:9px 1fr;gap:2px;align-items:center}
.pa-j{font-size:9px;color:var(--ink3);text-align:center;grid-row:1 / span 2}
.pa-d{display:block;height:15px;line-height:15px;border-radius:2px;text-align:center;font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.pa-d.nd{background:var(--beige2);color:var(--ink)}
table.pa tfoot td{text-align:center;font-size:11px;font-weight:700;border-top:2px solid var(--ink);padding:4px 2px}
.pa-leg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink2)}
.pa-renvoi{margin-left:auto;font-style:italic}
.pa-papier{display:none}

@media print{
  @page{size:A4 landscape;margin:0}
  .topbar,.nav,.voile,#toast,.modal-fond{display:none!important}
  .layout{display:block}
  .main{padding:0}
  body{background:#fff}
  .pa-page{max-width:none}
  .pa-page > :not(.pa-zone){display:none!important}
  .pa-zone{border:0;padding:7mm 8mm}
  .pa-tete{margin-bottom:2.5mm}
  .pa-tete img{height:11mm}
  .pa-tete h2{font-size:15pt}
  .pa-tete p{font-size:8pt}
  .pa-tete .pa-date{font-size:7pt}
  .pa-wrap{overflow:visible!important}
  table.pa{min-width:0}
  table.pa th{font-size:7.5pt;padding:.8mm .3mm}
  table.pa th.pa-n,table.pa td.pa-n{width:5mm}
  table.pa td{padding:.25mm .4mm}
  table.pa td.pa-n{font-size:6.5pt}
  table.pa td.pa-c.auj{box-shadow:none}
  .pa-in{grid-template-columns:2.2mm 1fr 1fr;gap:.4mm}
  .pa-j{font-size:5.5pt;grid-row:auto}
  .pa-ecran{display:none}
  .pa-papier{display:inline}
  .pa-d{height:4.5mm;line-height:4.5mm;font-size:6pt}
  table.pa tfoot td{font-size:7pt;padding:.8mm .3mm}
  .pa-leg{font-size:7.5pt;margin-top:2mm;gap:1mm 5mm}
  .pa-leg .chip{font-size:7pt}
}

/* ---- 01_outils.js ---- */
"use strict";
/* =====================================================================
   OUTILS GÉNÉRAUX : texte, nombres, dates, fichiers, fenêtres
   ===================================================================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function plein(x){ return String(x == null ? "" : x).trim() !== ""; }
function ascii(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 _.-]+/g, " ").replace(/\s+/g, " ").trim(); }
function deux(n){ return (n < 10 ? "0" : "") + n; }
function uid(p){ return (p || "id") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function copie(o){ return JSON.parse(JSON.stringify(o)); }
function arrondi(v, d){ var f = Math.pow(10, d == null ? 2 : d); return Math.round((+v || 0) * f + (v >= 0 ? 1e-9 : -1e-9)) / f; }

/* ---------- Nombres à la française ---------- */
var FMT = {};
function nombre(v, dec){
  dec = dec == null ? 0 : dec;
  var k = "n" + dec;
  if(!FMT[k]) FMT[k] = new Intl.NumberFormat("fr-FR", {minimumFractionDigits: dec, maximumFractionDigits: dec});
  var s = FMT[k].format(+v || 0);
  return s === "-0" || s === "-0,00" ? s.slice(1) : s;
}
function euros(v){ return nombre(v, 2) + " €"; }
function eurosCourt(v){ return (Math.abs(v % 1) > 0.004 ? nombre(v, 2) : nombre(v, 0)) + " €"; }
function qte(v){ return Math.abs(v % 1) > 1e-9 ? nombre(v, Math.abs(v * 10 % 1) > 1e-9 ? 2 : 1) : nombre(v, 0); }
function pct(v){ return v == null || !isFinite(v) ? "-" : (v > 0 ? "+" : "") + nombre(v * 100, 0) + " %"; }
/* Lecture d'un nombre saisi : « 1 250,5 », « 1250.5 », « 36 € » */
function lireNombre(s){
  if(typeof s === "number") return s;
  var t = String(s == null ? "" : s).replace(/[\s  €]/g, "").replace(",", ".");
  if(t === "" || t === "-") return null;
  var v = Number(t);
  return isFinite(v) ? v : null;
}

/* ---------- Dates ---------- */
var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
var MOIS_COURT = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
var JOURS = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
function isoJour(d){ return d.getFullYear() + "-" + deux(d.getMonth() + 1) + "-" + deux(d.getDate()); }
function aujourdhui(){ return isoJour(new Date()); }
function dateDe(iso){ var p = String(iso).split("-"); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
function dateFr(iso){ if(!iso) return ""; var p = String(iso).split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function moisDe(iso){ return String(iso).slice(0, 7); }
function moisTexte(m){ var p = String(m).split("-"); return MOIS[+p[1] - 1] + " " + p[0]; }
function moisTitre(m){ var t = moisTexte(m); return t.charAt(0).toUpperCase() + t.slice(1); }
function moisCourt(m){ var p = String(m).split("-"); return MOIS_COURT[+p[1] - 1] + " " + p[0].slice(2); }
function finDeMois(m){ var p = m.split("-"); return isoJour(new Date(+p[0], +p[1], 0)); }
function ajouterMois(m, n){ var p = m.split("-"), d = new Date(+p[0], +p[1] - 1 + n, 1); return d.getFullYear() + "-" + deux(d.getMonth() + 1); }
function ajouterJours(iso, n){ var d = dateDe(iso); d.setDate(d.getDate() + n); return isoJour(d); }
function joursEntre(a, b){ return Math.round((dateDe(b) - dateDe(a)) / 86400000); }
function moisCourant(){ return moisDe(aujourdhui()); }
/* Année scolaire d'un mois (septembre à août) : « 26/27 » */
function anneeScolaire(m){ var a = +m.slice(0, 4), mm = +m.slice(5, 7); var d = mm >= 9 ? a : a - 1; return String(d).slice(2) + "/" + String(d + 1).slice(2); }
function moisDeLAnnee(id){ var d = 2000 + +id.slice(0, 2), r = []; for(var i = 0; i < 12; i++) r.push(ajouterMois(d + "-09", i)); return r; }

/* ---------- Fichiers ---------- */
function telecharger(nom, contenu, type){
  var blob = contenu instanceof Blob ? contenu : new Blob(Array.isArray(contenu) ? contenu : [contenu], {type: type || "application/octet-stream"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function base64De(u8){
  var s = "", pas = 0x8000;
  for(var i = 0; i < u8.length; i += pas) s += String.fromCharCode.apply(null, u8.subarray(i, i + pas));
  return btoa(s);
}
function octetsDe(b64){ var b = atob(b64), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function utf8(s){ return new TextEncoder().encode(s); }

/* ---------- Messages et fenêtres ---------- */
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 3200);
}
function ouvrirModal(html, large){
  fermerModal();
  var f = document.createElement("div"); f.className = "modal-fond"; f.id = "modal";
  f.innerHTML = '<div class="modal' + (large ? " large" : "") + '" role="dialog" aria-modal="true">' + html + '</div>';
  f.addEventListener("mousedown", function(e){ if(e.target === f) fermerModal(); });
  f.addEventListener("click", function(e){ if(e.target.closest("[data-fermer]")) fermerModal(); });
  document.body.appendChild(f);
  var premier = f.querySelector("input:not([type=hidden]),select,textarea"); if(premier) try{ premier.focus(); }catch(e){}
  return f;
}
function fermerModal(){
  var m = $("modal"); if(!m) return;
  m.querySelectorAll("iframe[data-blob]").forEach(function(i){ URL.revokeObjectURL(i.getAttribute("data-blob")); });
  m.remove();

/* Couleurs du planning, par CFA (sobre : noir, beige, gris) */
var COULEURS = [
  {fond: "#151515", texte: "#ffffff"}, {fond: "#E9E6DF", texte: "#151515"}, {fond: "#ffffff", texte: "#151515", bord: "#151515"},
  {fond: "#7d7d78", texte: "#ffffff"}, {fond: "#cdcdc7", texte: "#151515"}, {fond: "#f4f2ed", texte: "#484845", bord: "#cdcdc7"}
];

function donneesDepart(){
  var I = copie(DATA.initial), r = reglagesDepart();
  var d = {
    app: APP, v: 1, cree: Date.now(), maj: null, sauvegarde: null, source: I.source,
    reglages: r,
    clients: I.clients.map(function(c){
      return Object.assign({siren: "", emailA: "", emailCc: "", objet: "", message: "", delai: null, actif: ["ga69", "ga42", "selform", "admtc"].indexOf(c.id) >= 0}, c);
    }),

    codes: I.codes,
    annees: I.annees,
    planning: I.planning,
    extras: I.extras,
    factures: I.factures.map(function(f){ return Object.assign({paiements: [], envoi: null}, f); }),
    controle: I.controle
  };
  // tarifs « montant manuel » (JURY, AUTRES) et libellés par défaut
  d.tarifs.forEach(function(t){
    if(!t.heuresDemi && !t.taux && t.mode === "heure") t.mode = "manuel";
    if(!t.libelle) t.libelle = t.mode === "manuel" ? "" : "Cours";
    if(t.mode === "jour" && !t.forfait) t.forfait = arrondi(t.heuresDemi * 2 * t.taux, 2);
  });
  // historique : les factures des 2 derniers mois sont considérées en attente de paiement
  var limite = ajouterMois(moisCourant(), -2);
  d.factures.forEach(function(f){ if(f.historique && f.mois >= limite && f.type === "facture") f.statut = "envoyee"; });
  // couleurs des CFA
  var cfas = []; d.codes.forEach(function(c){ if(cfas.indexOf(c.cfa) < 0) cfas.push(c.cfa); });
  d.couleurs = {}; cfas.forEach(function(c, i){ d.couleurs[c] = i % COULEURS.length; });
  return d;
}

function lireCache(){
  try{ var b = localStorage.getItem(CLE); return b ? migrer(JSON.parse(b)) : null; }catch(e){ stockageOK = false; return null; }

function charger(){
  var c = lireCache();

function migrer(d){
  if(!d || d.app !== APP) throw new Error("données inconnues");
  var r = reglagesDepart();
  d.reglages = d.reglages || r;
  ["emetteur", "mentions", "numerotation", "email"].forEach(function(k){ d.reglages[k] = Object.assign({}, r[k], d.reglages[k] || {}); });
  if(d.reglages.delaiRetard == null) d.reglages.delaiRetard = r.delaiRetard;
  // pas de franchise de TVA (formation exonérée) : l'ancienne mention « 293 B » est remplacée par l'exonération formation
  if(d.reglages.mentions.tva === "TVA non applicable, art. 293 B du CGI") d.reglages.mentions.tva = r.mentions.tva;
  delete d.reglages.seuilsTva;
  if(!plein(d.reglages.emetteur.nda) && plein(r.emetteur.nda)) d.reglages.emetteur.nda = r.emetteur.nda;   // NDA communiqué le 08/10/2026
  if(!d.reglages.fichier) d.reglages.fichier = r.fichier;
  d.extras = d.extras || []; d.factures = d.factures || []; d.couleurs = d.couleurs || {};
  return d;
}

/* ---------- Sauvegarde dans un fichier (indispensable : ce sont des factures) ---------- */
function joursSansSauvegarde(){ return D && D.sauvegarde ? Math.floor((Date.now() - D.sauvegarde) / 86400000) : null; }
function modifieDepuisSauvegarde(){ return !D || !D.sauvegarde || (D.maj && D.maj > D.sauvegarde + 1000); }
function majSauvegarde(){
  var el = $("sauv-etat"); if(!el || !D) return;
  if(DATA.enLigne){ if(typeof majEtatDrive === "function") majEtatDrive(el); return; }
  if(typeof AUTO !== "undefined" && AUTO.etat === "actif"){
    el.className = "etat" + (AUTO.erreur ? " alerte" : "");
    el.textContent = AUTO.erreur ? "Échec de la sauvegarde OneDrive" : AUTO.derniere ? "OneDrive : sauvegardé " + heureCourte(AUTO.derniere) : "OneDrive : sauvegarde active";
    return;
  }
  if(typeof AUTO !== "undefined" && AUTO.etat === "a_reactiver"){
    el.className = "etat alerte";
    el.innerHTML = '<button class="lien" style="font-size:12.5px;color:var(--warn);font-weight:700" data-act="auto-reactiver">Réactiver la sauvegarde OneDrive</button>';
    return;
  }
  var j = joursSansSauvegarde(), m = modifieDepuisSauvegarde();
  if(!D.sauvegarde){ el.textContent = "Jamais sauvegardé"; el.className = "etat alerte"; }
  else if(m && j >= 7){ el.textContent = "Dernière sauvegarde il y a " + j + " jours"; el.className = "etat alerte"; }
  else { el.textContent = m ? "Modifié depuis la dernière sauvegarde" : "Sauvegardé le " + dateFr(isoJour(new Date(D.sauvegarde))); el.className = "etat"; }
}

/* ---- 03_calculs.js ---- */
/* =====================================================================
   CALCULS : tarifs, planning, factures, numérotation, statuts
   ===================================================================== */
var UNITES = {
  h: {court: "h", q: "Nb d'heures", pu: "Taux horaire", nom: "heures"},
  j: {court: "j", q: "Nb de journées", pu: "Forfait jour", nom: "journées"},
  dossier: {court: "dossier(s)", q: "Nb de dossiers", pu: "Prix par dossier", nom: "dossiers"},
  copie: {court: "copie(s)", q: "Nb de copies", pu: "Prix par copie", nom: "copies"},
  forfait: {court: "forfait", q: "Quantité", pu: "Montant", nom: "forfait"},
  u: {court: "", q: "Quantité", pu: "Prix unitaire", nom: "unités"}
};

/* ---------- Codes, CFA, clients ---------- */
function codeInfo(code){ for(var i = 0; i < D.codes.length; i++) if(D.codes[i].code === code) return D.codes[i]; return null; }
function cfaDe(code){ var c = codeInfo(code); return c ? c.cfa : code; }
function client(id){ for(var i = 0; i < D.clients.length; i++) if(D.clients[i].id === id) return D.clients[i]; return null; }
function clientDeCfa(cfa){ for(var i = 0; i < D.clients.length; i++) if((D.clients[i].cfa || []).indexOf(cfa) >= 0) return D.clients[i]; return null; }
function clientDeCode(code){ return clientDeCfa(cfaDe(code)); }
function listeCfa(){ var r = []; D.codes.forEach(function(c){ if(r.indexOf(c.cfa) < 0) r.push(c.cfa); }); return r; }
function couleurCfa(cfa){
  var i = D.couleurs[cfa]; if(i == null){ i = Object.keys(D.couleurs).length % COULEURS.length; D.couleurs[cfa] = i; }
  return COULEURS[i];
}
function styleCode(code){ var c = couleurCfa(cfaDe(code)); return "background:" + c.fond + ";color:" + c.texte + (c.bord ? ";box-shadow:inset 0 0 0 1px " + c.bord : ""); }

/* Tarif d'un code à une date : la ligne la plus récente dont la date d'effet est passée (comme l'Excel) */
function tarif(code, iso){
  var ref = moisDe(iso || aujourdhui()) + "-01", best = null;
  D.tarifs.forEach(function(t){ if(t.code === code && (t.effet || "2000-01-01") <= ref && (!best || t.effet > best.effet)) best = t; });
  if(!best) D.tarifs.forEach(function(t){ if(t.code === code && (!best || t.effet < best.effet)) best = t; });
  return best;
}

/* ---------- Planning ---------- */
function anneeExiste(id){ return D.annees.some(function(a){ return a.id === id; }); }
function cellule(jour, k){ var an = anneeScolaire(moisDe(jour)), p = D.planning[an]; return p && p[jour] && p[jour][k] || null; }
function heuresCellule(c, jour){
  if(!c || !c.c) return 0;
  if(c.h != null && c.h !== "") return +c.h;
  var t = tarif(c.c, jour); return t ? +t.heuresDemi || 0 : 0;
}
function montantCellule(c, jour){
  if(!c || !c.c) return 0;
  var t = tarif(c.c, jour); if(!t || t.mode === "manuel") return 0;
  return heuresCellule(c, jour) * (+t.taux || 0);
}
function montantExtra(x){ return arrondi((+x.quantite || 0) * (+x.pu || 0), 2); }
function extrasDuMois(m){ return D.extras.filter(function(x){ return x.mois === m; }); }

/* Activité d'un mois : par code et par CFA (demi-journées, heures, montant) */
function activiteMois(m){
  var parCode = {}, parCfa = {}, total = {demi: 0, h: 0, ca: 0};
  function ajout(code, demi, h, ca){
    var o = parCode[code] || (parCode[code] = {code: code, demi: 0, h: 0, ca: 0, jours: []});
    o.demi += demi; o.h += h; o.ca += ca;
    var cfa = cfaDe(code), p = parCfa[cfa] || (parCfa[cfa] = {cfa: cfa, demi: 0, h: 0, ca: 0});
    p.demi += demi; p.h += h; p.ca += ca;
    total.demi += demi; total.h += h; total.ca += ca;
    return o;
  }
  var an = anneeScolaire(m), p = D.planning[an] || {};
  var fin = +finDeMois(m).slice(8);
  for(var j = 1; j <= fin; j++){
    var iso = m + "-" + deux(j), jour = p[iso]; if(!jour) continue;
    ["m", "a"].forEach(function(k){
      var c = jour[k]; if(!c || !c.c) return;
      var o = ajout(c.c, 1, heuresCellule(c, iso), montantCellule(c, iso));
      o.jours.push(iso);
    });
  }
  extrasDuMois(m).forEach(function(x){ ajout(x.code, 0, x.unite === "h" ? +x.quantite || 0 : 0, montantExtra(x)); });
  Object.keys(parCode).forEach(function(k){ parCode[k].ca = arrondi(parCode[k].ca, 2); });
  Object.keys(parCfa).forEach(function(k){ parCfa[k].ca = arrondi(parCfa[k].ca, 2); });
  total.ca = arrondi(total.ca, 2);
  return {parCode: parCode, parCfa: parCfa, total: total};
}
function activiteAnnee(id){
  var r = {mois: {}, parCfa: {}, total: {demi: 0, h: 0, ca: 0}};
  moisDeLAnnee(id).forEach(function(m){
    var a = activiteMois(m); r.mois[m] = a;
    Object.keys(a.parCfa).forEach(function(c){
      var o = r.parCfa[c] || (r.parCfa[c] = {cfa: c, h: 0, ca: 0});
      o.h += a.parCfa[c].h; o.ca += a.parCfa[c].ca;
    });
    r.total.demi += a.total.demi; r.total.h += a.total.h; r.total.ca += a.total.ca;
  });
  r.total.ca = arrondi(r.total.ca, 2);
  return r;
}

/* ---------- Factures ---------- */
function facture(id){ for(var i = 0; i < D.factures.length; i++) if(D.factures[i].id === id) return D.factures[i]; return null; }
function montantLigne(l){ return arrondi((+l.quantite || 0) * (+l.pu || 0), 2); }
function totalFacture(f){ var t = 0; (f.lignes || []).forEach(function(l){ t += montantLigne(l); }); t = arrondi(t, 2); return f.type === "avoir" ? -Math.abs(t) : t; }
function totalAffiche(f){ return f.historique && f.total != null ? f.total : totalFacture(f); }
function payeFacture(f){ var t = 0; (f.paiements || []).forEach(function(p){ t += +p.montant || 0; }); return arrondi(t, 2); }
function resteFacture(f){ if(f.statut === "payee" || f.type === "avoir" || f.statut === "annulee") return 0; return arrondi(totalAffiche(f) - payeFacture(f) - avoirsDe(f), 2); }
function avoirsDe(f){ var t = 0; D.factures.forEach(function(a){ if(a.type === "avoir" && a.avoirDe === f.id && a.statut !== "brouillon") t += Math.abs(totalAffiche(a)); }); return t; }
function emise(f){ return f.statut !== "brouillon" && f.statut !== "annulee"; }
function clientFacture(f){ return f.client || client(f.clientId) || {nom: "Client inconnu", adresse: []}; }
function delaiClient(f){ var c = client(f.clientId); return c && c.delai != null && c.delai !== "" ? +c.delai : +D.reglages.delaiRetard; }
function echeance(f){ return ajouterJours(f.date || aujourdhui(), delaiClient(f)); }
function enRetard(f){ return (f.statut === "emise" || f.statut === "envoyee") && f.type === "facture" && resteFacture(f) > 0.004 && echeance(f) < aujourdhui(); }
var STATUTS = {brouillon: "Brouillon", emise: "À envoyer", envoyee: "Envoyée", payee: "Payée", annulee: "Annulée"};
function statutHTML(f){
  if(enRetard(f)) return '<span class="st st-retard">En retard de ' + joursEntre(echeance(f), aujourdhui()) + ' j</span>';
  var s = f.statut, lib = STATUTS[s] || s;
  if(f.statut === "envoyee" && payeFacture(f) > 0) lib = "Payée en partie";
  if(f.type === "avoir" && f.statut !== "brouillon") lib = "Avoir émis";

/* Numérotation continue : AAAA-MM-NNN (AAAA-MM = mois facturé, NNN = compteur sans trou) */
function dernierNumero(type){
  var max = 0;
  D.factures.forEach(function(f){
    if(f.type !== type || !f.numero) return;
    var m = /(\d+)\s*$/.exec(f.numero); if(m) max = Math.max(max, +m[1]);
  });
  return max;
}
function prochainNumero(type){
  var n = D.reglages.numerotation, reg = type === "avoir" ? n.prochainAvoir : n.prochain;
  return Math.max(+reg || 0, dernierNumero(type) + 1);
}
function formaterNumero(type, mois, compteur){
  var fmt = type === "avoir" ? D.reglages.numerotation.formatAvoir : D.reglages.numerotation.format;
  return fmt.replace("{AAAA}", mois.slice(0, 4)).replace("{MM}", mois.slice(5, 7)).replace("{NNN}", String(compteur).padStart(3, "0"));
}

/* Libellé utilisé la dernière fois pour ce client et ce code (ex. « Cours BTS GPME 27 ») */
function dernierLibelle(clId, code){
  var best = null;
  D.factures.forEach(function(f){
    if(f.clientId !== clId || f.historique || f.statut === "brouillon") return;
    (f.lignes || []).forEach(function(l){ if(l.code === code && plein(l.libelle) && (!best || f.mois >= best.mois)) best = {mois: f.mois, libelle: l.libelle}; });
  });
  return best ? best.libelle : null;
}
/* Préparer les factures d'un mois à partir du planning (une par client), sans écraser l'existant */
function lignesDepuisPlanning(m, cl){
  var a = activiteMois(m), lignes = [];
  Object.keys(a.parCode).forEach(function(code){
    if((cl.cfa || []).indexOf(cfaDe(code)) < 0) return;
    var o = a.parCode[code], t = tarif(code, m + "-01");
    if(!t || t.mode === "manuel" || !o.demi) return;
    var hPlanning = 0, vus = {};
    o.jours.forEach(function(j){ if(vus[j]) return; vus[j] = 1; ["m", "a"].forEach(function(k){ var c = cellule(j, k); if(c && c.c === code) hPlanning += heuresCellule(c, j); }); });
    var lib = dernierLibelle(cl.id, code) || t.libelle || code;
    if(t.mode === "jour") lignes.push({libelle: lib, quantite: arrondi(hPlanning / (2 * (+t.heuresDemi || 1)), 3), unite: "j", pu: +t.forfait || arrondi(2 * t.heuresDemi * t.taux, 2), code: code});
    else lignes.push({libelle: lib, quantite: arrondi(hPlanning, 2), unite: "h", pu: +t.taux || 0, code: code});
  });
  extrasDuMois(m).forEach(function(x){
    if((cl.cfa || []).indexOf(cfaDe(x.code)) < 0) return;
    lignes.push({libelle: x.libelle, quantite: +x.quantite || 0, unite: x.unite || "forfait", pu: +x.pu || 0, code: x.code, extra: x.id});
  });
  return lignes;
}
function factureDuMois(clId, m){
  for(var i = 0; i < D.factures.length; i++){ var f = D.factures[i]; if(f.clientId === clId && f.mois === m && f.type === "facture" && f.statut !== "annulee") return f; }
  return null;
}
function clientsActifsDuMois(m){
  var a = activiteMois(m), ids = [];
  Object.keys(a.parCfa).forEach(function(cfa){ if(a.parCfa[cfa].ca > 0 || a.parCfa[cfa].demi > 0){ var c = clientDeCfa(cfa); if(c && ids.indexOf(c.id) < 0) ids.push(c.id); } });
  return ids;
}
function nouvelleFacture(clId, m, type){
  var cl = client(clId);
  return {id: uid("f"), type: type || "facture", numero: null, statut: "brouillon", mois: m, date: aujourdhui(),
    du: m + "-01", au: finDeMois(m), clientId: clId, client: null, lignes: [], paiements: [], envoi: null, note: "", cree: Date.now()};
}
function preparerMois(m){
  var crees = [], existantes = [];
  clientsActifsDuMois(m).forEach(function(id){
    var ex = factureDuMois(id, m);
    if(ex){ existantes.push(ex); return; }
    var f = nouvelleFacture(id, m);
    f.lignes = lignesDepuisPlanning(m, client(id));
    if(!f.lignes.length) return;
    D.factures.push(f); crees.push(f);
  });
  if(crees.length) sauver();
  return {crees: crees, existantes: existantes};
}

/* Émettre : numéro définitif, client figé sur la facture */
function emettre(f){
  if(f.numero) { f.statut = "emise"; return; }
  var n = prochainNumero(f.type);
  f.numero = formaterNumero(f.type, f.mois, n);
  if(D.factures.some(function(x){ return x !== f && x.numero === f.numero; })) throw new Error("Le numéro " + f.numero + " existe déjà");
  if(f.type === "avoir") D.reglages.numerotation.prochainAvoir = n + 1; else D.reglages.numerotation.prochain = n + 1;
  f.client = copie(client(f.clientId));
  f.statut = "emise"; f.emiseLe = Date.now();
}

/* =====================================================================
   PDF : générateur autonome (aucune bibliothèque externe)
   Polices Tenorite intégrées (TrueType, codage WinAnsi), logo JPEG.
   ===================================================================== */
var PDF_W = 595.28, PDF_H = 841.89;
var CP1252 = {0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89,
  0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95,
  0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F,
  0x202F: 0xA0, 0x2009: 0xA0, 0x2007: 0xA0};
function codeWin(ch){
  var u = ch.charCodeAt(0);
  if(u === 9) return 32;
  if(u >= 32 && u < 127) return u;
  if(u >= 0xA0 && u <= 0xFF) return u;
  return CP1252[u] || 63;
}
function enWin(s){ s = String(s == null ? "" : s); var r = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) r[i] = codeWin(s[i]); return r; }
function hexWin(s){ var b = enWin(s), h = ""; for(var i = 0; i < b.length; i++) h += (b[i] < 16 ? "0" : "") + b[i].toString(16); return "<" + h + ">"; }
function largeurTexte(s, police, taille, espacement){
  var w = DATA.pdf.metriques[police].largeurs, b = enWin(s), t = 0;
  for(var i = 0; i < b.length; i++) t += b[i] >= 32 ? w[b[i] - 32] || 0 : 0;
  return t * taille / 1000 + (espacement || 0) * b.length;
}
/* Coupe un texte en lignes qui tiennent dans une largeur */
function couper(texte, police, taille, largeurMax){
  var lignes = [];
  String(texte == null ? "" : texte).split(/\n/).forEach(function(par){
    var mots = par.split(/ +/), cour = "";
    mots.forEach(function(m){
      var essai = cour ? cour + " " + m : m;
      if(largeurTexte(essai, police, taille) <= largeurMax || !cour){
        cour = essai;
        while(largeurTexte(cour, police, taille) > largeurMax && cour.length > 1){   // mot trop long : coupure forcée
          var k = cour.length; while(k > 1 && largeurTexte(cour.slice(0, k), police, taille) > largeurMax) k--;
          lignes.push(cour.slice(0, k)); cour = cour.slice(k);
        }
      } else { lignes.push(cour); cour = m; }
    });
    lignes.push(cour);
  });
  return lignes;
}

/* ---------- Page : opérations de dessin (coordonnées depuis le HAUT de la page) ---------- */
function PagePDF(w, h){ this.ops = []; this.polices = {}; this.images = {}; this.w = w || PDF_W; this.h = h || PDF_H; }
PagePDF.prototype.couleur = function(c, trait){ return c.map(function(x){ return (+x).toFixed(3); }).join(" ") + (trait ? " RG" : " rg"); };
PagePDF.prototype.texte = function(x, haut, s, o){
  o = o || {}; var p = o.police || "R", t = o.taille || 10, esp = o.espacement || 0;
  if(!plein(s)) return;
  var w = largeurTexte(s, p, t, esp);
  if(o.align === "r") x -= w; else if(o.align === "c") x -= w / 2;
  this.polices[p] = 1;
  this.ops.push("BT " + this.couleur(o.couleur || [0.082, 0.082, 0.082]) + " /F" + p + " " + t + " Tf " + (esp ? esp.toFixed(2) + " Tc " : "") +
    x.toFixed(2) + " " + (this.h - haut).toFixed(2) + " Td " + hexWin(s) + " Tj" + (esp ? " 0 Tc" : "") + " ET");
};
PagePDF.prototype.rect = function(x, haut, w, h, fond, trait, epaisseur){
  var y = this.h - haut - h, op = x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re";
  if(fond && trait) this.ops.push(this.couleur(fond) + " " + this.couleur(trait, true) + " " + (epaisseur || 0.6) + " w " + op + " B");
  else if(fond) this.ops.push(this.couleur(fond) + " " + op + " f");
  else this.ops.push(this.couleur(trait || [0, 0, 0], true) + " " + (epaisseur || 0.6) + " w " + op + " S");
};
PagePDF.prototype.trait = function(x1, h1, x2, h2, couleur, epaisseur){
  this.ops.push(this.couleur(couleur || [0.8, 0.8, 0.78], true) + " " + (epaisseur || 0.6) + " w " + x1.toFixed(2) + " " + (this.h - h1).toFixed(2) + " m " + x2.toFixed(2) + " " + (this.h - h2).toFixed(2) + " l S");
};
PagePDF.prototype.image = function(nom, x, haut, w, h){
  this.images[nom] = 1;
  this.ops.push("q " + w.toFixed(2) + " 0 0 " + h.toFixed(2) + " " + x.toFixed(2) + " " + (this.h - haut - h).toFixed(2) + " cm /" + nom + " Do Q");

/* ---------- Assemblage du fichier PDF ---------- */
async function compresser(u8){
  if(typeof CompressionStream === "undefined") return null;
  try{
    var flux = new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate"));
    return new Uint8Array(await new Response(flux).arrayBuffer());
  }catch(e){ return null; }
}
function chaineInfo(s){ var h = "FEFF"; for(var i = 0; i < s.length; i++) h += s.charCodeAt(i).toString(16).padStart(4, "0"); return "<" + h + ">"; }

  var parts = [], offsets = [], taille = 0, num = 0;
  function pousse(x){ var u = typeof x === "string" ? utf8(x) : x; parts.push(u); taille += u.length; }
  function objet(corps, flux){
    num++; offsets[num] = taille;
    if(flux){ pousse(num + " 0 obj\n" + corps + "\nstream\n"); pousse(flux); pousse("\nendstream\nendobj\n"); }
    else pousse(num + " 0 obj\n" + corps + "\nendobj\n");
    return num;
  }
  function reserve(){ return ++num; }
  pousse("%PDF-1.4\n"); pousse(new Uint8Array([37, 226, 227, 207, 211, 10]));
  var nCatalogue = reserve(), nPages = reserve();
  // polices utilisées
  var utilisees = {}, nImages = {};
  pages.forEach(function(p){ Object.keys(p.polices).forEach(function(k){ utilisees[k] = 1; }); Object.keys(p.images).forEach(function(k){ nImages[k] = 0; }); });
  var nPolices = {};
  for(var k in utilisees){
    var m = DATA.pdf.metriques[k], brut = octetsDe(DATA.pdf.polices[k]), comp = await compresser(brut);
    var nFichier = objet("<< /Length " + (comp || brut).length + " /Length1 " + brut.length + (comp ? " /Filter /FlateDecode" : "") + " >>", comp || brut);
    var nom = m.nom.replace(/[^A-Za-z0-9-]/g, "");
    var nDesc = objet("<< /Type /FontDescriptor /FontName /" + nom + " /Flags 32 /FontBBox [" + m.bbox.join(" ") + "] /ItalicAngle " + m.italicAngle +
      " /Ascent " + m.ascent + " /Descent " + m.descent + " /CapHeight " + m.capHeight + " /StemV " + m.stemV + " /FontFile2 " + nFichier + " 0 R >>");
    nPolices[k] = objet("<< /Type /Font /Subtype /TrueType /BaseFont /" + nom + " /FirstChar 32 /LastChar 255 /Widths [" + m.largeurs.join(" ") +
      "] /Encoding /WinAnsiEncoding /FontDescriptor " + nDesc + " 0 R >>");
  }
  for(var im in nImages){
    var jpg = octetsDe(DATA.pdf.logo.b64);
    nImages[im] = objet("<< /Type /XObject /Subtype /Image /Width " + DATA.pdf.logo.l + " /Height " + DATA.pdf.logo.h +
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpg.length + " >>", jpg);
  }
  var res = "<< /Font << " + Object.keys(nPolices).map(function(k){ return "/F" + k + " " + nPolices[k] + " 0 R"; }).join(" ") + " >>" +
    (Object.keys(nImages).length ? " /XObject << " + Object.keys(nImages).map(function(k){ return "/" + k + " " + nImages[k] + " 0 R"; }).join(" ") + " >>" : "") + " >>";
  var kids = [];
  for(var i = 0; i < pages.length; i++){
    var brutC = utf8(pages[i].ops.join("\n")), compC = await compresser(brutC);
    var nC = objet("<< /Length " + (compC || brutC).length + (compC ? " /Filter /FlateDecode" : "") + " >>", compC || brutC);
    kids.push(objet("<< /Type /Page /Parent " + nPages + " 0 R /MediaBox [0 0 " + pages[i].w + " " + pages[i].h + "] /Resources " + res + " /Contents " + nC + " 0 R >>"));
  }
  var d = new Date(), date = "D:" + d.getFullYear() + deux(d.getMonth() + 1) + deux(d.getDate()) + deux(d.getHours()) + deux(d.getMinutes()) + deux(d.getSeconds());
  var nInfo = objet("<< /Title " + chaineInfo(meta.titre || "") + " /Author " + chaineInfo(meta.auteur || "") + " /Creator " + chaineInfo("Facturation BF Conseil") +
    " /Producer " + chaineInfo("Facturation BF Conseil") + " /CreationDate (" + date + ") >>");
  offsets[nCatalogue] = taille; pousse(nCatalogue + " 0 obj\n<< /Type /Catalog /Pages " + nPages + " 0 R >>\nendobj\n");
  offsets[nPages] = taille; pousse(nPages + " 0 obj\n<< /Type /Pages /Kids [" + kids.map(function(k){ return k + " 0 R"; }).join(" ") + "] /Count " + kids.length + " >>\nendobj\n");
  var xref = taille, x = "xref\n0 " + (num + 1) + "\n0000000000 65535 f \n";

  pousse(x + "trailer\n<< /Size " + (num + 1) + " /Root " + nCatalogue + " 0 R /Info " + nInfo + " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
  var out = new Uint8Array(taille), pos = 0;

}

/* ---- 05_courriel.js ---- */
/* =====================================================================
   E-MAILS : brouillon Outlook (.eml avec le PDF joint) ou e-mail simple
   Un fichier hors connexion ne peut pas envoyer d'e-mail : c'est toujours
   toi qui vérifies et cliques sur « Envoyer » dans ta messagerie.
   ===================================================================== */
function adresses(s){ return String(s || "").split(/[;,\s]+/).filter(function(x){ return /@/.test(x); }); }
function enteteUtf8(s){ return /^[\x20-\x7e]*$/.test(s) ? s : "=?UTF-8?B?" + base64De(utf8(s)) + "?="; }
function plier76(b64){ return b64.replace(/(.{76})/g, "$1\r\n"); }

function contenuEmail(f, relance){
  var cl = client(f.clientId) || clientFacture(f), E = D.reglages.email;
  var objet = relance ? E.objetRelance : (plein(cl.objet) ? cl.objet : E.objet);
  var message = relance ? E.messageRelance : (plein(cl.message) ? cl.message : E.message);
  return {a: adresses(cl.emailA), cc: adresses(cl.emailCc), objet: remplir(objet, f), message: remplir(message, f)};
}
async function emlFacture(f, relance){
  var c = contenuEmail(f, relance), pdf = await pdfFacture(f), nomPdf = nomFichier(f) + ".pdf", b = "BFC_" + Date.now().toString(36);
  var t = [];
  if(c.a.length) t.push("To: " + c.a.join(", "));
  if(c.cc.length) t.push("Cc: " + c.cc.join(", "));
  t.push("Subject: " + enteteUtf8(c.objet), "X-Unsent: 1", "MIME-Version: 1.0", 'Content-Type: multipart/mixed; boundary="' + b + '"', "",
    "--" + b, 'Content-Type: text/plain; charset="UTF-8"', "Content-Transfer-Encoding: base64", "", plier76(base64De(utf8(c.message.replace(/\r?\n/g, "\r\n")))), "",
    "--" + b, 'Content-Type: application/pdf; name="' + nomPdf + '"', "Content-Transfer-Encoding: base64",
    'Content-Disposition: attachment; filename="' + nomPdf + '"', "", plier76(base64De(pdf)), "", "--" + b + "--", "");
  return {texte: t.join("\r\n"), nom: nomFichier(f) + (relance ? " - relance" : "") + ".eml", contenu: c};
}
function lienMailto(f, relance){
  var c = contenuEmail(f, relance), q = [];
  if(c.cc.length) q.push("cc=" + encodeURIComponent(c.cc.join(",")));
  q.push("subject=" + encodeURIComponent(c.objet), "body=" + encodeURIComponent(c.message));
  return "mailto:" + c.a.map(encodeURIComponent).join(",") + "?" + q.join("&");
}
async function telechargerPDF(f){
  var blob = await blobFacture(f);
  telecharger(nomFichier(f) + ".pdf", blob);
  var copie = !emise(f) ? false : DATA.enLigne ? await archiverPdfDrive(f, blob) : (typeof archiverPDF === "function" ? await archiverPDF(f, blob) : false);
  toast("PDF téléchargé : " + nomFichier(f) + ".pdf" + (copie ? (DATA.enLigne ? " (copie rangée dans Google Drive)" : " (copie rangée dans OneDrive)") : ""));
}
// téléphone ou tablette seulement : sur l'ordinateur, le brouillon Outlook reste le plus pratique
function partageFichiersPossible(){
  if(!(window.matchMedia && matchMedia("(pointer: coarse)").matches)) return false;
  try{ return !!(navigator.canShare && navigator.canShare({files: [new File([""], "test.pdf", {type: "application/pdf"})]})); }catch(e){ return false; }
}
async function partagerFacture(f, relance){
  var c = contenuEmail(f, relance), blob = await blobFacture(f);
  if(DATA.enLigne && emise(f)) archiverPdfDrive(f, blob);
  var fichier = new File([blob], nomFichier(f) + ".pdf", {type: "application/pdf"});
  try{ await navigator.share({files: [fichier], title: c.objet, text: c.message}); }
  catch(e){ if(e.name !== "AbortError") toast("Partage impossible : " + e.message); return false; }
  if(!relance) f.envoi = {date: aujourdhui(), mode: "partage", a: c.a.join(", ")}; else f.relances = (f.relances || []).concat([{date: aujourdhui(), mode: "partage"}]);
  sauver();
  return true;
}
async function preparerEmail(f, mode, relance){
  var c = contenuEmail(f, relance);
  if(mode === "eml"){
    var e = await emlFacture(f, relance);
    telecharger(e.nom, [e.texte], "message/rfc822");
    toast("Brouillon téléchargé : ouvre-le, il s'affiche dans Outlook avec le PDF joint");
  } else {
    await telechargerPDF(f);
    var a = document.createElement("a"); a.href = lienMailto(f, relance); document.body.appendChild(a); a.click(); a.remove();
    toast("E-mail prêt : joins le PDF qui vient d'être téléchargé");
  }
  if(!relance){ f.envoi = {date: aujourdhui(), mode: mode, a: c.a.join(", ")}; }
  else { f.relances = (f.relances || []).concat([{date: aujourdhui(), mode: mode}]); }
  sauver();
  return c;
}

function facturesAnnee(id){ return D.factures.filter(function(f){ return emise(f) && anneeScolaire(f.mois) === id; }); }
function totaux(liste){
  var t = {facture: 0, encaisse: 0, attente: 0, retard: 0, nAttente: 0, nRetard: 0};
  liste.forEach(function(f){
    var m = totalAffiche(f); t.facture += m;
    if(f.type === "avoir") return;
    var reste = resteFacture(f);
    t.encaisse += f.statut === "payee" ? m - avoirsDe(f) : payeFacture(f);
    if(reste > 0.004){ t.attente += reste; t.nAttente++; if(enRetard(f)){ t.retard += reste; t.nRetard++; } }
  });
  return t;
}

function alertesAccueil(){
  var h = "", e = D.reglages.emetteur, j = joursSansSauvegarde();
  if(AUTO.etat === "a_reactiver") h += '<div class="enc alerte"><b>Sauvegarde OneDrive en pause :</b> Chrome demande ton accord pour écrire dans le dossier « ' + esc(AUTO.handle.name) + ' ». <button class="lien" data-act="auto-reactiver">Réactiver</button></div>';
  else if(AUTO.etat === "inactif") h += '<div class="enc alerte"><b>Active la sauvegarde automatique dans OneDrive</b> : choisis une fois ton dossier, et chaque modification y sera enregistrée. <button class="lien" data-act="aller" data-v="parametres/sauvegarde">Activer</button></div>';
  else if(AUTO.etat === "actif" && AUTO.erreur) h += '<div class="enc erreur"><b>La sauvegarde OneDrive a échoué :</b> ' + esc(AUTO.erreur) + ' <button class="lien" data-act="aller" data-v="parametres/sauvegarde">Voir</button></div>';
  else if(AUTO.etat === "indisponible"){
    if(!D.sauvegarde) h += '<div class="enc alerte"><b>Pense à sauvegarder.</b> Tes données sont dans ce navigateur. Clique sur « Sauvegarder » en haut à droite et range le fichier en lieu sûr (OneDrive, clé USB). <button class="lien" data-act="sauvegarder">Sauvegarder maintenant</button></div>';
    else if(modifieDepuisSauvegarde() && j >= 7) h += '<div class="enc alerte"><b>Dernière sauvegarde il y a ' + j + ' jours.</b> <button class="lien" data-act="sauvegarder">Sauvegarder maintenant</button></div>';
  }
  if(!plein(e.capital)) h += '<div class="enc alerte"><b>Mentions de ta SARL à compléter :</b> le capital social doit figurer sur tes factures. <button class="lien" data-act="aller" data-v="parametres/entreprise">Compléter</button></div>';
  if(!plein(e.nda)) h += '<div class="enc alerte"><b>Numéro de déclaration d’activité à ajouter :</b> il justifie l’exonération de TVA indiquée sur tes factures. <button class="lien" data-act="aller" data-v="parametres/entreprise">Compléter</button></div>';
  var sansMail = D.clients.filter(function(c){ return c.actif && !adresses(c.emailA).length; });
  if(sansMail.length) h += '<div class="enc"><b>Adresses e-mail à renseigner</b> pour ' + sansMail.map(function(c){ return esc(c.nom); }).join(", ") + '. <button class="lien" data-act="aller" data-v="clients">Ouvrir les clients</button></div>';
  return h;
}

function blocMois(m, precedent){
  var ids = clientsActifsDuMois(m), h = '<div class="bloc"><div class="bloc-tete"><h2>' + esc(moisTitre(m)) + (precedent ? ' <span class="muet">(mois dernier)</span>' : ' <span class="muet">(en cours)</span>') + '</h2></div>';
  var a = activiteMois(m);
  if(!ids.length && !D.factures.some(function(f){ return f.mois === m && f.statut !== "annulee"; })){
    return h + '<p class="muet" style="font-size:14px">Aucune activité au planning ce mois-ci.</p></div>';
  }
  var aPreparer = 0;
  h += '<table class="t"><tbody>';
  ids.forEach(function(id){
    var c = client(id), f = factureDuMois(id, m), prevu = 0;
    (c.cfa || []).forEach(function(cfa){ if(a.parCfa[cfa]) prevu += a.parCfa[cfa].ca; });
    h += '<tr><td><b>' + esc(c.nom) + '</b><br><span class="muet" style="font-size:12.5px">Prévu au planning : ' + euros(prevu) + '</span></td>';
    if(f) h += '<td class="num">' + euros(totalAffiche(f)) + '</td><td class="act">' + statutHTML(f) + ' <button class="btn petit" data-act="aller" data-v="facture/' + f.id + '">Ouvrir</button></td>';
    else { aPreparer++; h += '<td class="num muet">-</td><td class="act"><span class="st st-brouillon">À préparer</span></td>'; }
    h += '</tr>';
  });
  h += '</tbody></table>';
  if(aPreparer) h += '<div style="margin-top:12px"><button class="btn pri" data-act="preparer-mois" data-m="' + m + '">' + ICO.facture + ' Préparer ' + (aPreparer > 1 ? "les " + aPreparer + " factures" : "la facture") + ' de ' + esc(MOIS[+m.slice(5) - 1]) + '</button></div>';
  return h + '</div>';
}

function blocAFaire(){
  var brouillons = D.factures.filter(function(f){ return f.statut === "brouillon"; });
  var aEnvoyer = D.factures.filter(function(f){ return f.statut === "emise" && f.type === "facture"; });
  var retards = D.factures.filter(enRetard);
  if(!brouillons.length && !aEnvoyer.length && !retards.length) return '<div class="bloc"><h2>À faire</h2><p class="muet" style="font-size:14px">Rien en attente : tout est émis, envoyé et suivi.</p></div>';
  var h = '<div class="bloc"><h2>À faire</h2><table class="t"><tbody>';
  function ligne(f, quoi, bouton){
    return '<tr class="clic" data-act="aller" data-v="facture/' + f.id + '"><td>' + quoi + '</td><td>' + esc(clientFacture(f).nom) + ' · ' + esc(moisTexte(f.mois)) + '</td><td class="num">' + euros(totalAffiche(f)) + '</td><td class="act">' + bouton + '</td></tr>';
  }
  brouillons.forEach(function(f){ h += ligne(f, '<span class="st st-brouillon">Brouillon</span>', '<span class="btn petit">Vérifier et émettre</span>'); });
  aEnvoyer.forEach(function(f){ h += ligne(f, '<span class="st st-emise">À envoyer</span> ' + esc(f.numero), '<span class="btn petit">Envoyer</span>'); });
  retards.forEach(function(f){ h += ligne(f, statutHTML(f) + ' ' + esc(f.numero), '<span class="btn petit">Relancer</span>'); });
  return h + '</tbody></table></div>';
}

ACTIONS["preparer-mois"] = function(el){
  var m = el.getAttribute("data-m"), r = preparerMois(m);
  if(r.crees.length === 1){ toast("Facture préparée : vérifie-la avant de l’émettre"); aller("facture/" + r.crees[0].id); }
  else if(r.crees.length){ toast(r.crees.length + " factures préparées en brouillon"); aller("factures"); }
  else toast("Rien à préparer : les factures de ce mois existent déjà");
};

/* ---- 08_planning.js ---- */
/* =====================================================================
   PLANNING : calendrier matin / après-midi, heures, lignes en plus
   ===================================================================== */
function idAnneeUrl(id){ return String(id).replace("/", "-"); }
function idAnneeDeUrl(s){ return String(s || "").replace("-", "/"); }

VUES.planning = function(anUrl, m){
  var an = idAnneeDeUrl(anUrl) || anneeScolaire(moisCourant());
  if(!anneeExiste(an)) an = D.annees.length ? D.annees[D.annees.length - 1].id : anneeScolaire(moisCourant());
  var mois = moisDeLAnnee(an), vueAnnee = m === "annee";
  if(!vueAnnee && mois.indexOf(m) < 0) m = mois.indexOf(moisCourant()) >= 0 ? moisCourant() : mois[0];
  var A = activiteAnnee(an), act = vueAnnee ? null : A.mois[m];
  var h = '<div class="page' + (vueAnnee ? " pa-page" : "") + '">';
  h += '<div class="p-tete"><div><div class="kick">Planning</div><h1 class="p-titre">Année ' + esc(an) + '</h1>' +
    '<p class="p-sous">' + qte(A.total.h) + ' h · ' + euros(A.total.ca) + ' prévus · moyenne ' + euros(A.total.ca / 12) + ' par mois</p></div>' +
    '<div class="barre-actions">' + D.annees.map(function(a){ return '<button class="btn petit' + (a.id === an ? " pri" : "") + '" data-act="aller" data-v="planning/' + idAnneeUrl(a.id) + (vueAnnee ? "/annee" : "") + '">' + esc(a.id) + '</button>'; }).join("") +
    '<button class="btn petit beige" data-act="nouvelle-annee">' + ICO.plus + ' Nouvelle année</button></div></div>';
  // Onglets : toute l'année, puis les mois
  h += '<div class="onglets"><button class="onglet onglet-an' + (vueAnnee ? " on" : "") + '" data-act="aller" data-v="planning/' + idAnneeUrl(an) + '/annee">Toute l’année<small>' + qte(A.total.h) + ' h</small></button>' + mois.map(function(x){
    var a = A.mois[x];
    return '<button class="onglet' + (x === m ? " on" : "") + '" data-act="aller" data-v="planning/' + idAnneeUrl(an) + '/' + x + '">' + esc(MOIS_COURT[+x.slice(5) - 1]) +
      '<small>' + (a.total.ca ? eurosCourt(a.total.ca) : "-") + '</small></button>';
  }).join("") + '</div>';
  if(vueAnnee){
    document.title = "Planning " + anneeLongue(an);
    h += '<div class="barre-actions pa-actions"><button class="btn pri" data-act="pa-imprimer" data-an="' + idAnneeUrl(an) + '" data-masque="0">' + ICO.imprimer + ' Imprimer</button>' +
      '<button class="btn" data-act="pa-imprimer" data-an="' + idAnneeUrl(an) + '" data-masque="1">' + ICO.imprimer + ' Imprimer sans les établissements (ND*)</button>' +
      '<span class="aide">Clique sur un jour pour ouvrir son mois et le modifier.</span></div>';
    return h + planningAnneeHTML(an, A) + '</div>';
  }
  h += '<div class="pl-wrap"><div>' + calendrierHTML(m) + '</div><div class="pl-cote">' + coteMoisHTML(m, act) + '</div></div>';
  h += recapAnneeHTML(an, A);
  return h + '</div>';
};

function optionsCodes(sel){
  var h = '<option value="">-</option>', vus = {};
  D.codes.forEach(function(c){ if(c.afficher !== false || c.code === sel){ vus[c.code] = 1; h += '<option' + (c.code === sel ? " selected" : "") + '>' + esc(c.code) + '</option>'; } });
  if(sel && !vus[sel]) h += '<option selected>' + esc(sel) + '</option>';
  return h;
}
function calendrierHTML(m){
  var fin = +finDeMois(m).slice(8), auj = aujourdhui();
  var h = '<table class="cal"><thead><tr><th>Jour</th><th>Matin</th><th>Après-midi</th></tr></thead><tbody>';
  for(var j = 1; j <= fin; j++){
    var iso = m + "-" + deux(j), d = dateDe(iso), we = d.getDay() === 0 || d.getDay() === 6;
    h += '<tr class="' + (we ? "we" : "") + (iso === auj ? " auj" : "") + '"><td class="j"><b>' + j + '</b> <span class="jl">' + JOURS[d.getDay()] + '</span><span class="jc">' + JOURS[d.getDay()].slice(0, 3) + '</span></td>';
    ["m", "a"].forEach(function(k){
      var c = cellule(iso, k) || {}, hc = heuresCellule(c, iso), mod = c.c && c.h != null && c.h !== "", tc = c.c ? tarif(c.c, iso) : null, manuel = tc && tc.mode === "manuel" && !mod;
      h += '<td><div class="demi"><select class="code" data-ch="demi" data-j="' + iso + '" data-k="' + k + '" aria-label="' + j + ' ' + (k === "m" ? "matin" : "après-midi") + '"' +
        (c.c ? ' style="' + styleCode(c.c) + '"' : '') + '>' + optionsCodes(c.c) + '</select>' +
        '<button class="ico-btn" data-act="demi-detail" data-j="' + iso + '" data-k="' + k + '" title="Heures et note">' +
        (c.c && !manuel ? '<span class="h' + (mod ? " mod" : "") + '">' + qte(hc) + ' h</span>' : ICO.note) + '</button>' +
        (plein(c.n) ? '<button class="ico-btn note" data-act="demi-detail" data-j="' + iso + '" data-k="' + k + '" title="' + esc(c.n) + '">' + ICO.note + '</button>' : '') +
        '</div></td>';
    });
    h += '</tr>';
  }
  return h + '</tbody></table>';
}
function coteMoisHTML(m, act){
  var h = '<div class="bloc"><h2>' + esc(moisTitre(m)) + '</h2>';
  var cfas = Object.keys(act.parCfa);
  if(!cfas.length) h += '<p class="muet" style="font-size:14px;margin-bottom:10px">Aucune intervention ce mois-ci.</p>';
  else {
    h += '<table class="t recap-mois"><thead><tr><th>CFA</th><th class="num">Demi-j.</th><th class="num">Heures</th><th class="num">Montant</th></tr></thead><tbody>';
    cfas.forEach(function(cfa){ var o = act.parCfa[cfa]; h += '<tr><td>' + chipCode(cfa) + '</td><td class="num">' + o.demi + '</td><td class="num">' + qte(o.h) + '</td><td class="num">' + euros(o.ca) + '</td></tr>'; });
    h += '<tr class="total"><td>Total</td><td class="num">' + act.total.demi + '</td><td class="num">' + qte(act.total.h) + '</td><td class="num">' + euros(act.total.ca) + '</td></tr></tbody></table>';
  }
  // lignes en plus
  var ex = extrasDuMois(m);
  h += '<div class="bloc-tete" style="margin-top:16px"><h2 style="font-size:15px">Lignes en plus</h2><button class="btn petit" data-act="extra" data-m="' + m + '">' + ICO.plus + ' Ajouter</button></div>';
  h += '<p class="aide" style="margin:-6px 0 8px">Jury, corrections, réunion, heures en plus : ajoutées au mois et à la facture du client.</p>';
  if(ex.length){
    h += '<table class="t"><tbody>' + ex.map(function(x){
      return '<tr class="clic" data-act="extra" data-m="' + m + '" data-id="' + x.id + '"><td>' + chipCode(x.code) + '<br><span style="font-size:13px">' + esc(x.libelle) + '</span></td><td class="num">' + euros(montantExtra(x)) + '</td></tr>';
    }).join("") + '</tbody></table>';
  }
  var ids = clientsActifsDuMois(m), restants = ids.filter(function(id){ return !factureDuMois(id, m); });
  h += '<div style="margin-top:16px">' + (restants.length ? '<button class="btn pri" style="width:100%" data-act="preparer-mois" data-m="' + m + '">' + ICO.facture + ' Préparer les factures du mois</button>'
    : (ids.length ? '<p class="aide">Les factures de ce mois sont déjà préparées. <button class="lien" data-act="aller" data-v="factures">Voir les factures</button></p>' : '')) + '</div>';
  return h + '</div>';
}
function recapAnneeHTML(an, A){
  var mois = moisDeLAnnee(an), cfas = Object.keys(A.parCfa);
  if(!cfas.length) return "";
  var h = '<div class="bloc" style="margin-top:18px"><h2>L’année ' + esc(an) + ' par CFA <span class="muet">(heures, puis montant)</span></h2><div class="tab-wrap"><table class="t"><thead><tr><th>CFA</th>' +
    mois.map(function(m){ return '<th class="num">' + esc(MOIS_COURT[+m.slice(5) - 1]) + '</th>'; }).join("") + '<th class="num">Total</th></tr></thead><tbody>';
  cfas.forEach(function(cfa){
    h += '<tr><td>' + chipCode(cfa) + '</td>' + mois.map(function(m){ var o = A.mois[m].parCfa[cfa]; return '<td class="num">' + (o ? qte(o.h) + ' h<br><span class="muet" style="font-size:12px">' + eurosCourt(o.ca) + '</span>' : '<span class="muet">-</span>') + '</td>'; }).join("") +
      '<td class="num"><b>' + qte(A.parCfa[cfa].h) + ' h</b><br><span style="font-size:12px">' + euros(A.parCfa[cfa].ca) + '</span></td></tr>';
  });
  h += '<tr class="total"><td>Total</td>' + mois.map(function(m){ return '<td class="num">' + qte(A.mois[m].total.h) + ' h<br><span style="font-size:12px">' + eurosCourt(A.mois[m].total.ca) + '</span></td>'; }).join("") +
    '<td class="num">' + qte(A.total.h) + ' h<br>' + euros(A.total.ca) + '</td></tr></tbody></table></div></div>';

/* ---------- Toute l'année : écran, puis PDF à imprimer (complet ou établissements masqués) ---------- */
function anneeLongue(an){ var d = 2000 + +String(an).slice(0, 2); return d + "-" + (d + 1); }
function demiAnnee(c, masque){
  if(!c || !c.c) return '<span class="pa-d"></span>';
  if(masque) return '<span class="pa-d nd">ND*</span>';
  return '<span class="pa-d" style="' + styleCode(c.c) + '">' + esc(cfaDe(c.c)) + '</span>';
}
// établissements présents au planning de l'année, avec un code (pour la couleur) et le client
function cfasDeLAnnee(an){
  var p = D.planning[an] || {}, vus = {};
  Object.keys(p).forEach(function(jour){ ["m", "a"].forEach(function(k){ var c = p[jour][k]; if(c && c.c && !vus[cfaDe(c.c)]) vus[cfaDe(c.c)] = c.c; }); });
  return Object.keys(vus).sort().map(function(cfa){ return {cfa: cfa, code: vus[cfa], client: clientDeCfa(cfa)}; });
}
function planningAnneeHTML(an, A){
  var mois = moisDeLAnnee(an), auj = aujourdhui(), masque = false, e = D.reglages.emetteur;
  var h = '<div class="pa-zone' + (masque ? " masque" : "") + '"><div class="pa-tete"><img src="' + DATA.logo + '" alt="BF Conseil"><div>' +
    '<h2>Planning ' + anneeLongue(an) + '</h2><p>' + esc([e.signature, e.nom].filter(plein).join(" · ")) + (masque ? "" : " · " + qte(A.total.h) + " h sur l’année") + '</p></div>' +
    '<p class="pa-date">Édité le ' + dateFr(auj) + '</p></div>';
  h += '<div class="tab-wrap pa-wrap"><table class="pa"><thead><tr><th class="pa-n"></th>' +
    mois.map(function(m){ return '<th>' + esc(MOIS_COURT[+m.slice(5) - 1]) + ' ' + m.slice(2, 4) + '</th>'; }).join("") + '</tr></thead><tbody>';
  for(var j = 1; j <= 31; j++){
    h += '<tr><td class="pa-n">' + j + '</td>';
    mois.forEach(function(m){
      if(j > +finDeMois(m).slice(8)){ h += '<td class="pa-x"></td>'; return; }
      var iso = m + "-" + deux(j), d = dateDe(iso).getDay();
      h += '<td class="pa-c' + (d === 0 || d === 6 ? " we" : "") + (iso === auj ? " auj" : "") + '"' +
        (masque ? '' : ' data-act="aller" data-v="planning/' + idAnneeUrl(an) + '/' + m + '" title="' + esc(JOURS[d] + " " + dateFr(iso)) + '"') +
        '><div class="pa-in"><span class="pa-j">' + JOURS[d].charAt(0) + '</span>' + demiAnnee(cellule(iso, "m"), masque) + demiAnnee(cellule(iso, "a"), masque) + '</div></td>';
    });
    h += '</tr>';
  }
  h += '</tbody>';
  if(!masque) h += '<tfoot><tr><td class="pa-n">h</td>' + mois.map(function(m){ var t = A.mois[m].total.h; return '<td>' + (t ? qte(t) + ' h' : '-') + '</td>'; }).join("") + '</tr></tfoot>';
  h += '</table></div><div class="pa-leg"><span>Dans chaque case : <b>matin</b> <span class="pa-ecran">en haut</span><span class="pa-papier">à gauche</span>, <b>après-midi</b> <span class="pa-ecran">en bas</span><span class="pa-papier">à droite</span>.</span>';
  if(masque) h += '<span>Case vide : disponible.</span><span class="pa-renvoi">* ND : non disponible</span>';
  else {
    cfasDeLAnnee(an).forEach(function(o){
      h += '<span><span class="chip" style="' + styleCode(o.code) + '">' + esc(o.cfa) + '</span> ' + esc(o.client ? o.client.nom : "") + '</span>';
    });
  }
  return h + '</div></div>';
}
function rgbPdf(hex){ var x = String(hex || "#000").replace("#", ""); return [0, 2, 4].map(function(i){ return parseInt(x.substr(i, 2), 16) / 255; }); }
async function pdfPlanningAnnee(an, masque){
  var W = PDF_H, H = PDF_W, MX = 22, p = new PagePDF(W, H), e = D.reglages.emetteur, A = activiteAnnee(an), mois = moisDeLAnnee(an);
  var C_WE = [0.969, 0.969, 0.957], C_HORS = [0.925, 0.918, 0.898], C_ND = [0.851, 0.831, 0.788];
  // en-tête : logo, titre, nom
  var lw = 46, lh = lw * DATA.pdf.logo.h / DATA.pdf.logo.l;
  p.image("Logo", MX, 14, lw, lh);
  p.texte(MX + lw + 14, 33, "Planning " + anneeLongue(an), {police: "D", taille: 18});
  p.texte(MX + lw + 14, 45, [e.signature, e.nom].filter(plein).join(" · ") + (masque ? "" : " · " + qte(A.total.h) + " h sur l'année"), {taille: 8, couleur: C_GRIS2});
  p.texte(W - MX, 45, "Édité le " + dateFr(aujourdhui()), {taille: 7, couleur: C_GRIS, align: "r"});
  // tableau : une colonne par mois, une ligne par jour, matin à gauche et après-midi à droite
  var T0 = 58, TH = 15, RH = 14.6, NW = 16, MW = (W - 2 * MX - NW) / 12, T1 = T0 + TH, FIN = T1 + 31 * RH;
  p.rect(MX, T0, W - 2 * MX, TH, C_ENCRE);
  mois.forEach(function(m, i){ p.texte(MX + NW + i * MW + MW / 2, T0 + 10.3, MOIS_COURT[+m.slice(5) - 1] + " " + m.slice(2, 4), {police: "B", taille: 7.5, couleur: C_BLANC, align: "c"}); });
  for(var j = 1; j <= 31; j++){
    var y = T1 + (j - 1) * RH;
    p.rect(MX, y, NW, RH, C_BEIGE3);
    p.texte(MX + NW / 2, y + RH / 2 + 2.3, String(j), {taille: 6.5, couleur: C_GRIS, align: "c"});
    mois.forEach(function(m, i){
      var x = MX + NW + i * MW;
      if(j > +finDeMois(m).slice(8)){ p.rect(x, y, MW, RH, C_HORS); return; }
      var iso = m + "-" + deux(j), d = dateDe(iso).getDay();
      if(d === 0 || d === 6) p.rect(x, y, MW, RH, C_WE);
      p.texte(x + 4.2, y + RH / 2 + 2, JOURS[d].charAt(0), {taille: 5.5, couleur: C_GRIS, align: "c"});
      var hw = (MW - 11.5) / 2;
      ["m", "a"].forEach(function(k, n){
        var c = cellule(iso, k); if(!c || !c.c) return;
        var hx = x + 9 + n * (hw + 1.2), hy = y + 2, hh = RH - 4;
        var fond = C_ND, encre = C_ENCRE, bord = null, txt = "ND*";
        if(!masque){ var cc = couleurCfa(cfaDe(c.c)); fond = rgbPdf(cc.fond); encre = rgbPdf(cc.texte); bord = cc.bord ? rgbPdf(cc.bord) : null; txt = cfaDe(c.c); }
        if(bord) p.rect(hx, hy, hw, hh, fond, bord, 0.5); else p.rect(hx, hy, hw, hh, fond);
        var t = 6.2; while(t > 4 && largeurTexte(txt, "B", t) > hw - 2) t -= 0.2;
        p.texte(hx + hw / 2, hy + hh / 2 + t * 0.36, txt, {police: "B", taille: t, couleur: encre, align: "c"});
      });
    });
  }
  // filets de la grille
  for(var r = 0; r <= 31; r++) p.trait(MX, T1 + r * RH, W - MX, T1 + r * RH, C_FILET, 0.4);
  for(var cI = 0; cI <= 12; cI++) p.trait(MX + NW + cI * MW, T0, MX + NW + cI * MW, FIN, cI === 0 ? C_FILET : C_FILET, 0.4);
  p.trait(MX, T0, MX, FIN, C_FILET, 0.4); p.trait(W - MX, T0, W - MX, FIN, C_FILET, 0.4);
  var bas = FIN;
  if(!masque){
    p.trait(MX, FIN, W - MX, FIN, C_ENCRE, 1.2);
    p.texte(MX + NW / 2, FIN + 10, "h", {taille: 6.5, couleur: C_GRIS, align: "c"});
    mois.forEach(function(m, i){ var t = A.mois[m].total.h; p.texte(MX + NW + i * MW + MW / 2, FIN + 10, t ? qte(t) + " h" : "-", {police: "B", taille: 7, align: "c"}); });
    bas = FIN + 15;
  }
  // légende
  var ly = bas + 14, lx = MX, phrase = "Dans chaque case : matin à gauche, après-midi à droite.";
  p.texte(lx, ly, phrase, {taille: 7.5, couleur: C_GRIS2}); lx += largeurTexte(phrase, "R", 7.5) + 18;
  if(masque){
    p.texte(lx, ly, "Case vide : disponible.", {taille: 7.5, couleur: C_GRIS2});
    p.texte(W - MX, ly, "* ND : non disponible", {taille: 7.5, couleur: C_GRIS2, align: "r"});
  } else cfasDeLAnnee(an).forEach(function(o){
    var cc = couleurCfa(o.cfa), nom = o.client ? o.client.nom : "", cw = largeurTexte(o.cfa, "B", 6.5) + 10, tw = largeurTexte(nom, "R", 7);
    if(lx + cw + tw + 6 > W - MX){ lx = MX; ly += 14; }
    if(cc.bord) p.rect(lx, ly - 7.5, cw, 10, rgbPdf(cc.fond), rgbPdf(cc.bord), 0.5); else p.rect(lx, ly - 7.5, cw, 10, rgbPdf(cc.fond));
    p.texte(lx + cw / 2, ly, o.cfa, {police: "B", taille: 6.5, couleur: rgbPdf(cc.texte), align: "c"});
    p.texte(lx + cw + 4, ly, nom, {taille: 7, couleur: C_GRIS2});
    lx += cw + tw + 18;
  });
  return assemblerPDF([p], {titre: "Planning " + anneeLongue(an), auteur: e.signature || e.nom || ""});
}
