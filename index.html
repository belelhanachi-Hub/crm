/* ---------- Saisie ---------- */
CHANGE.fac = function(el){
  var f = facture(el.getAttribute("data-id")); if(!f) return;
  var champ = el.getAttribute("data-champ"), v = el.value;
  if(champ.indexOf("cl.") === 0){
    if(!f.client) return;
    var k = champ.slice(3);
    f.client[k] = k === "adresse" ? v.split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean) : v;
    planifier(); return;
  }
  if(champ === "note"){ f.note = v; planifier(); return; }
  if(verrouillee(f)) return;
  if(champ === "mois" && v){
    if(f.du === f.mois + "-01" && f.au === finDeMois(f.mois)){ f.du = v + "-01"; f.au = finDeMois(v); }
    f.mois = v; sauver(); rendre(); return;
  }
  f[champ] = v; planifier();
};
CHANGE["fac-client"] = function(el){ var f = facture(el.getAttribute("data-id")); f.clientId = el.value; f.client = null; sauver(); rendre(); };
CHANGE.ligne = function(el){
  var f = facture(el.getAttribute("data-id")); if(!f || verrouillee(f)) return;
  var i = +el.getAttribute("data-i"), champ = el.getAttribute("data-champ"), l = f.lignes[i];
  if(champ === "quantite" || champ === "pu"){ var n = lireNombre(el.value); l[champ] = n == null ? 0 : n; }
  else l[champ] = el.value;
  var cell = $("lm-" + i); if(cell) cell.innerHTML = "<b>" + euros((f.type === "avoir" ? -1 : 1) * montantLigne(l)) + "</b>";
  $("fac-totaux").innerHTML = totauxHTML(f);
  planifier();
};
ACTIONS["ligne-plus"] = function(el){ var f = facture(el.getAttribute("data-id")); f.lignes.push({libelle: "", quantite: 1, unite: (f.lignes[0] || {}).unite || "h", pu: (f.lignes[0] || {}).pu || 0}); sauver(); rendre(); };

/* ---------- Émission ---------- */
ACTIONS.emettre = async function(el){
  var id = el.getAttribute("data-id");
  if(!(await pretPourEmettre())) return;
  var f = facture(id); if(!f || f.statut !== "brouillon"){ rendre(); return; }
  var cl = client(f.clientId), t = totalFacture(f), pb = [];
  if(!(f.lignes || []).length) pb.push("la facture n’a aucune ligne");
  if(Math.abs(t) < 0.005) pb.push("le total est de 0 €");
  (f.lignes || []).forEach(function(l, i){ if(!plein(l.libelle)) pb.push("la ligne " + (i + 1) + " n’a pas de libellé"); });
  if(pb.length){ ouvrirModal('<h2>Impossible d’émettre</h2><p>Corrige d’abord : ' + pb.map(esc).join(", ") + '.</p><div class="modal-acts"><button class="btn pri" data-fermer>Compris</button></div>'); return; }
  var num = formaterNumero(f.type, f.mois, prochainNumero(f.type));
  ouvrirModal('<h2>Émettre ' + (f.type === "avoir" ? "l’avoir" : "la facture") + ' ?</h2><p>Elle recevra le numéro <b>' + esc(num) + '</b>, pour <b>' + esc(cl.nom) + '</b>, d’un montant de <b>' + euros(t) + '</b>.</p>' +
    '<p>Une fois émise, elle n’est plus modifiable : une erreur se corrige avant l’envoi avec « Corriger », ou par un avoir après l’envoi.</p>' +
    '<label class="case"><input type="checkbox" id="em-pdf" checked> Télécharger le PDF tout de suite</label>' +
    '<div class="modal-acts"><button class="btn" data-fermer>Annuler</button><button class="btn pri" id="em-ok">' + ICO.coche + ' Émettre</button></div>');
  $("em-ok").onclick = async function(){
    var pdf = $("em-pdf").checked;
    try{ emettre(f); }catch(e){ toast(e.message); return; }
    if(f.type === "avoir" && f.avoirDe){ var o = facture(f.avoirDe); if(o && Math.abs(avoirsDe(o) - Math.abs(totalAffiche(o))) < 0.01) o.statut = "annulee"; }
    sauver(); fermerModal(); rendre(); toast((f.type === "avoir" ? "Avoir " : "Facture ") + f.numero + " émise");
    if(pdf) await telechargerPDF(f);
  };
};
ACTIONS.corriger = function(el){
  var f = facture(el.getAttribute("data-id"));
  confirmer("Corriger la facture " + f.numero + " ?", "À faire seulement si elle n’a pas encore été reçue par le client. Le numéro est conservé. Si elle a déjà été envoyée, fais plutôt un avoir.", "Corriger", function(){
    f.deverrouillee = true; sauver(); rendre();
  });
};
ACTIONS.reverrouiller = function(el){ var f = facture(el.getAttribute("data-id")); delete f.deverrouillee; f.client = copie(f.client || client(f.clientId)); sauver(); rendre(); toast("Correction terminée : pense à retélécharger le PDF"); };
ACTIONS.avoir = function(el){
  var f = facture(el.getAttribute("data-id"));
  confirmer("Faire un avoir sur la facture " + f.numero + " ?", "Un avoir annule tout ou partie d’une facture déjà envoyée. Il reprend ses lignes : tu pourras ajuster les montants avant de l’émettre.", "Créer l’avoir", function(){
    var a = nouvelleFacture(f.clientId, moisCourant(), "avoir");

    lignes.push([f.numero, f.type === "avoir" ? "Avoir" : "Facture", dateFr(f.date), clientFacture(f).nom, moisTexte(f.mois), dateFr(f.du), dateFr(f.au),
      n(totalAffiche(f)), STATUTS[f.statut] || f.statut, f.payeeLe ? dateFr(f.payeeLe) : "", n(resteFacture(f)),
      (f.lignes || []).map(function(l){ return l.libelle; }).join(" / ")]);
  });
  var csv = lignes.map(function(l){

/* =====================================================================
   STATISTIQUES : historique facturé, prévu au planning, clients, TVA
   ===================================================================== */
function factureParMois(an){
  var r = {}; moisDeLAnnee(an).forEach(function(m){ r[m] = 0; });
  D.factures.forEach(function(f){ if(emise(f) && r[f.mois] != null) r[f.mois] += totalAffiche(f); });
  return r;
}
function heuresFacturees(liste){
  var h = 0; liste.forEach(function(f){ (f.lignes || []).forEach(function(l){ if(l.unite === "h") h += (f.type === "avoir" ? -1 : 1) * (+l.quantite || 0); }); });
  return h;
}
function parClient(liste){
  var r = {}; liste.forEach(function(f){ r[f.clientId] = (r[f.clientId] || 0) + totalAffiche(f); }); return r;
}
function somme(o){ var t = 0; Object.keys(o).forEach(function(k){ t += o[k]; }); return arrondi(t, 2); }
function evolHTML(n, n1){ if(!n1) return '<span class="muet">-</span>'; var e = (n - n1) / Math.abs(n1); return '<span class="evol ' + (e >= 0 ? "pos" : "neg") + '">' + pct(e) + '</span>'; }

/* Graphique en barres : facturé N, N-1, et prévu au planning (trait) */
function graphMois(an, an1){
  var N = factureParMois(an), N1 = factureParMois(an1), mois = moisDeLAnnee(an), P = anneeExiste(an) ? activiteAnnee(an).mois : null;
  var max = 1; mois.forEach(function(m, i){ max = Math.max(max, N[m], N1[mois1(m)] || 0, P ? P[m].total.ca : 0); });
  function mois1(m){ return ajouterMois(m, -12); }
  var W = 760, H = 230, g = 62, b = 26, pas = (W - g - 10) / 12, ech = (H - 46) / max;
  var s = '<svg class="graph" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Chiffre d’affaires par mois">';
  [0, 0.5, 1].forEach(function(k){ var y = H - 26 - k * max * ech; s += '<line x1="' + g + '" x2="' + (W - 6) + '" y1="' + y + '" y2="' + y + '" stroke="#e3e3df"/><text x="' + (g - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + nombre(k * max, 0) + ' €</text>'; });
  mois.forEach(function(m, i){
    var x = g + i * pas + (pas - 2 * b / 2 - 4) / 2, v1 = N1[mois1(m)] || 0, v = N[m] || 0;
    s += '<rect x="' + x + '" y="' + (H - 26 - v1 * ech) + '" width="' + (b / 2) + '" height="' + (v1 * ech) + '" fill="#d9d4c9"><title>' + esc(moisTexte(mois1(m))) + ' : ' + euros(v1) + '</title></rect>';
    s += '<rect x="' + (x + b / 2 + 2) + '" y="' + (H - 26 - v * ech) + '" width="' + (b / 2) + '" height="' + (v * ech) + '" fill="#151515"><title>' + esc(moisTexte(m)) + ' : ' + euros(v) + '</title></rect>';
    if(P && P[m].total.ca) s += '<line x1="' + (x - 3) + '" x2="' + (x + b + 5) + '" y1="' + (H - 26 - P[m].total.ca * ech) + '" y2="' + (H - 26 - P[m].total.ca * ech) + '" stroke="#9a520a" stroke-width="2"><title>Prévu au planning : ' + euros(P[m].total.ca) + '</title></line>';
    s += '<text x="' + (x + b / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(MOIS_COURT[+m.slice(5) - 1]) + '</text>';
  });
  s += '</svg><div class="legende"><span><span class="pastille" style="background:#151515"></span>Facturé ' + esc(an) + '</span><span><span class="pastille" style="background:#d9d4c9"></span>Facturé ' + esc(an1) + '</span>' +
    (P ? '<span><span class="pastille" style="background:#9a520a;height:3px;vertical-align:3px"></span>Prévu au planning ' + esc(an) + '</span>' : '') + '</div>';
  return s;
}

    (prevu ? '<div class="kpi beige"><div class="l">Prévu au planning</div><div class="v">' + eurosCourt(prevu.total.ca) + '</div><div class="s">' + qte(prevu.total.h) + ' h · ' + (prevu.total.ca ? nombre(100 * tN / prevu.total.ca, 0) : 0) + ' % facturé</div></div>' : '') + '</div>';
  h += '<div class="bloc"><h2>Chiffre d’affaires par mois</h2>' + graphMois(an, an1) + '</div>';

  h += '<div class="grille2"><div class="bloc" style="padding:0"><div class="tab-wrap"><table class="t"><thead><tr><th>Mois</th><th class="num">' + esc(an1) + '</th><th class="num">' + esc(an) + '</th><th class="num">Écart</th><th class="num">Évol.</th>' +
    (prevu ? '<th class="num">Prévu</th>' : '') + '</tr></thead><tbody>';
  mois.forEach(function(m){
    var v = N[m], v1 = N1[ajouterMois(m, -12)];
    h += '<tr><td>' + esc(MOIS[+m.slice(5) - 1]) + '</td><td class="num">' + euros(v1) + '</td><td class="num"><b>' + euros(v) + '</b></td><td class="num">' + euros(v - v1) + '</td><td class="num">' + evolHTML(v, v1) + '</td>' +
      (prevu ? '<td class="num muet">' + euros(prevu.mois[m].total.ca) + '</td>' : '') + '</tr>';
  });
  h += '<tr class="total"><td>Total</td><td class="num">' + euros(tN1) + '</td><td class="num">' + euros(tN) + '</td><td class="num">' + euros(tN - tN1) + '</td><td class="num">' + evolHTML(tN, tN1) + '</td>' + (prevu ? '<td class="num">' + euros(prevu.total.ca) + '</td>' : '') + '</tr></tbody></table></div></div>';
  // Par client
  var PC = parClient(LN), PC1 = parClient(LN1), ids = Object.keys(Object.assign({}, PC, PC1)).sort(function(a, b){ return (PC[b] || 0) - (PC[a] || 0); });
  var maxC = 1; ids.forEach(function(id){ maxC = Math.max(maxC, PC[id] || 0); });
  h += '<div class="bloc"><h2>Par client</h2>';
  ids.forEach(function(id){

  h += '</div></div>';
  // Toutes les années
  var toutes = listeAnnees(), clientsT = [];
  D.factures.forEach(function(f){ if(emise(f) && clientsT.indexOf(f.clientId) < 0) clientsT.push(f.clientId); });

  var totA = {};
  clientsT.forEach(function(id){
    h += '<tr><td>' + esc((client(id) || {}).nom || id) + '</td>' + toutes.map(function(a){ var v = parClient(facturesAnnee(a))[id] || 0; totA[a] = (totA[a] || 0) + v; return '<td class="num">' + (v ? euros(v) : '<span class="muet">-</span>') + '</td>'; }).join("") + '</tr>';

  // Par année civile (utile pour la comptabilité de la SARL)
  var parAn = {};
  D.factures.forEach(function(f){ if(emise(f)){ var a = f.mois.slice(0, 4); parAn[a] = (parAn[a] || 0) + totalAffiche(f); } });
  var ans = Object.keys(parAn).sort();

    ans.map(function(a){ return '<td class="num">' + euros(parAn[a]) + '</td>'; }).join("") + '</tr></tbody></table></div></div>';
  return h + '</div>';
};

/* ---- 12_sauvegarde_auto.js ---- */
/* =====================================================================
   SAUVEGARDE AUTOMATIQUE DANS UN DOSSIER (OneDrive)
   Chrome et Edge seulement (API « File System Access »). Le dossier choisi
   est mémorisé ; Chrome peut redemander l'autorisation à chaque ouverture :
   un clic sur « Réactiver » suffit.
   ===================================================================== */
var AUTO = {handle: null, etat: "inactif", derniere: null, erreur: null};   // inactif | a_reactiver | actif | indisponible
var NOM_SAUVEGARDE = "Sauvegarde facturation BF Conseil.json";
var tAuto = null;

function fsDisponible(){ return typeof window.showDirectoryPicker === "function" && typeof indexedDB !== "undefined"; }
function baseIdb(){
  return new Promise(function(ok, ko){
    var r = indexedDB.open("bfconseil-facturation", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("cles"); };
    r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ ko(r.error); };
  });
}
async function idb(op, cle, val){
  var db = await baseIdb();
  return new Promise(function(ok, ko){
    var st = db.transaction("cles", op === "get" ? "readonly" : "readwrite").objectStore("cles");
    var r = op === "get" ? st.get(cle) : op === "put" ? st.put(val, cle) : st.delete(cle);
    r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ ko(r.error); };
  });
}

async function initAuto(){
  if(!fsDisponible()){ AUTO.etat = "indisponible"; majSauvegarde(); return; }
  try{
    var h = await idb("get", "dossier");
    if(!h){ AUTO.etat = "inactif"; }
    else {
      AUTO.handle = h;
      AUTO.derniere = await idb("get", "derniere") || null;
      AUTO.etat = (await h.queryPermission({mode: "readwrite"})) === "granted" ? "actif" : "a_reactiver";
    }
  }catch(e){ AUTO.etat = "inactif"; }
  majSauvegarde();
  if(AUTO.etat === "actif" && modifieDepuisSauvegarde()) planifierAuto();
  if(VUE.p === "accueil" || VUE.p === "parametres") rendre();
}
function planifierAuto(){
  if(AUTO.etat !== "actif") return;
  clearTimeout(tAuto); tAuto = setTimeout(ecrireAuto, 1500);
}
async function ecrireFichier(dossier, nom, contenu){
  var fh = await dossier.getFileHandle(nom, {create: true}), w = await fh.createWritable();
  await w.write(contenu); await w.close();
}
async function ecrireAuto(){
  if(AUTO.etat !== "actif" || !AUTO.handle) return;
  var avant = D.sauvegarde;
  try{
    var maintenant = Date.now();
    D.sauvegarde = maintenant;
    var json = JSON.stringify(D, null, 1);
    await ecrireFichier(AUTO.handle, NOM_SAUVEGARDE, json);
    var hist = await AUTO.handle.getDirectoryHandle("Historique des sauvegardes", {create: true});
    await ecrireFichier(hist, "Sauvegarde " + aujourdhui() + ".json", json);   // une copie par jour
    AUTO.derniere = maintenant; AUTO.erreur = null;
    idb("put", "derniere", maintenant).catch(function(){});
    try{ localStorage.setItem(CLE, JSON.stringify(D)); }catch(e){}
  }catch(e){
    D.sauvegarde = avant;
    AUTO.erreur = e.message || String(e);
    if(e.name === "NotAllowedError" || e.name === "SecurityError") AUTO.etat = "a_reactiver";
  }
  majSauvegarde();
}
/* Copie des PDF émis dans le même dossier : Factures PDF/AAAA/ */
async function archiverPDF(f, blob){
  if(AUTO.etat !== "actif" || !AUTO.handle) return false;
  try{
    var d = await AUTO.handle.getDirectoryHandle("Factures PDF", {create: true});
    d = await d.getDirectoryHandle(f.mois.slice(0, 4), {create: true});
    await ecrireFichier(d, nomFichier(f) + ".pdf", blob);
    return true;
  }catch(e){ AUTO.erreur = e.message || String(e); majSauvegarde(); return false; }
}

ACTIONS["auto-choisir"] = async function(){

    var h = await window.showDirectoryPicker({id: "bfconseil-facturation", mode: "readwrite", startIn: "documents"});

    await idb("put", "dossier", h);
    AUTO.handle = h; AUTO.etat = "actif";
    await ecrireAuto();
    toast(AUTO.erreur ? "Le dossier ne peut pas être utilisé : " + AUTO.erreur : "Sauvegarde automatique activée dans « " + h.name + " »");
    rendre();
  }catch(e){ if(e.name !== "AbortError") toast("Impossible d'utiliser ce dossier : " + (e.message || e)); }
};
ACTIONS["auto-reactiver"] = async function(){
  if(!AUTO.handle) return ACTIONS["auto-choisir"]();
  try{
    if((await AUTO.handle.requestPermission({mode: "readwrite"})) === "granted"){ AUTO.etat = "actif"; await ecrireAuto(); toast("Sauvegarde OneDrive réactivée"); }
  }catch(e){ toast("Réactivation impossible : " + (e.message || e)); }
  rendre();
};

    if(AUTO.erreur) h += '<div class="enc erreur" style="margin-top:10px">Dernière tentative en échec : ' + esc(AUTO.erreur) + '</div>';

  }
  return h + '<p style="font-size:14.5px">Choisis une fois ton dossier OneDrive : ensuite, chaque modification y est sauvegardée toute seule, et tes PDF y sont rangés.</p>' +
    '<p style="font-size:14px;margin-top:8px">Dossier conseillé (déjà créé) : <b>OneDrive (personnel) &gt; BF Conseil &gt; Facturation</b>. Dans la fenêtre, va dans « OneDrive - Personnel », ouvre « BF Conseil », sélectionne « Facturation », puis clique sur « Sélectionner un dossier » et autorise la modification.</p>' +
    '<p class="aide" style="margin-top:6px">Évite un « OneDrive - nom d’une entreprise » : c’est l’espace d’un client, pas le tien.</p>' +

/* ---- 13_drive.js ---- */
/* =====================================================================
   GOOGLE DRIVE (version en ligne uniquement)
   Connexion avec le compte Google Workspace, données dans
   « Facturation BF Conseil / donnees-facturation.json », copie par jour,
   PDF émis dans « Factures PDF / AAAA ». Droit demandé : drive.file
   (l'application ne voit que les fichiers qu'elle a créés).
   Une copie locale permet d'afficher les données même hors connexion.
   ===================================================================== */
var DRIVE = {token: null, expire: 0, etat: "deconnecte", email: "", dossierId: null, fichierId: null, version: null,
  enAttente: false, derniere: null, erreur: null, copieJour: null, accueil: false};
var NOM_DOSSIER = "Facturation BF Conseil", NOM_DONNEES = "donnees-facturation.json";
var CLE_DRIVE = "bfconseil-facturation-drive", CLE_JETON = "bfconseil-facturation-jeton";
var API_DRIVE = "https://www.googleapis.com/drive/v3/files", UPLOAD_DRIVE = "https://www.googleapis.com/upload/drive/v3/files";
var tDrive = null, envoiEnCours = false, clientJeton = null, attenteJeton = null;

function memoriserDrive(){
  try{ localStorage.setItem(CLE_DRIVE, JSON.stringify({dossierId: DRIVE.dossierId, fichierId: DRIVE.fichierId, version: DRIVE.version,
    enAttente: DRIVE.enAttente, email: DRIVE.email, derniere: DRIVE.derniere, copieJour: DRIVE.copieJour})); }catch(e){}
}
function relireDrive(){ try{ Object.assign(DRIVE, JSON.parse(localStorage.getItem(CLE_DRIVE) || "{}")); }catch(e){} }
// le jeton (valable 1 h) reste dans l'onglet seulement : il survit à un rechargement, pas à la fermeture
function memoriserJeton(){ try{ if(DRIVE.token) sessionStorage.setItem(CLE_JETON, JSON.stringify({t: DRIVE.token, e: DRIVE.expire})); else sessionStorage.removeItem(CLE_JETON); }catch(e){} }
function relireJeton(){ try{ var j = JSON.parse(sessionStorage.getItem(CLE_JETON) || "null"); if(j && j.e > Date.now()){ DRIVE.token = j.t; DRIVE.expire = j.e; } }catch(e){} }

/* ---------- Connexion (Google Identity Services) ---------- */
function chargerGis(){
  return new Promise(function(ok, ko){
    if(window.google && google.accounts && google.accounts.oauth2) return ok();
    var s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = function(){ ok(); }; s.onerror = function(){ ko(new Error("Google est injoignable : vérifie ta connexion Internet")); };
    document.head.appendChild(s);
  });
}
// préparé dès l'ouverture : au clic, la fenêtre Google s'ouvre tout de suite (sinon Safari la bloque)
function preparerClient(){
  if(clientJeton || !(window.google && google.accounts && google.accounts.oauth2)) return;
  var cfg = {
    client_id: DATA.google.clientId,
    scope: "https://www.googleapis.com/auth/drive.file",
    callback: function(r){
      var a = attenteJeton; attenteJeton = null; if(!a) return;
      if(r.error){ a.ko(new Error(r.error_description || r.error)); return; }
      DRIVE.token = r.access_token; DRIVE.expire = Date.now() + (Math.max(300, +r.expires_in || 3600) - 120) * 1000; memoriserJeton(); a.ok();
    },
    error_callback: function(e){
      var a = attenteJeton; attenteJeton = null; if(!a) return;
      a.ko(new Error(e && e.type === "popup_closed" ? "Fenêtre de connexion fermée" : e && e.type === "popup_failed_to_open" ? "Le navigateur a bloqué la fenêtre de connexion Google : autorise les fenêtres pour ce site" : (e && (e.message || e.type)) || "Connexion impossible"));
    }
  };
  if(DRIVE.email) cfg.login_hint = DRIVE.email;
  if(DATA.google.domaine) cfg.hd = DATA.google.domaine;
  clientJeton = google.accounts.oauth2.initTokenClient(cfg);
}
function demanderJeton(){
  return new Promise(function(ok, ko){
    preparerClient();
    if(!clientJeton){ ko(new Error("Google est injoignable : vérifie ta connexion Internet")); return; }
    attenteJeton = {ok: ok, ko: ko};
    clientJeton.requestAccessToken({prompt: ""});
  });
}
function jetonValide(){ return !!DRIVE.token && Date.now() < DRIVE.expire; }
function erreurConnexion(){ var e = new Error("Connexion Google à renouveler"); e.connexion = true; return e; }
async function apiDrive(url, opts){
  if(!jetonValide()) throw erreurConnexion();
  opts = opts || {};
  opts.headers = Object.assign({Authorization: "Bearer " + DRIVE.token}, opts.headers || {});
  var r = await fetch(url, opts);
  if(r.status === 401){ DRIVE.token = null; memoriserJeton(); throw erreurConnexion(); }
  if(!r.ok){ var t = ""; try{ t = await r.text(); }catch(e){} throw new Error("Google Drive a répondu " + r.status + (t ? " : " + t.slice(0, 180) : "")); }
  return r;
}

/* ---------- Fichiers Drive ---------- */
function echapper(s){ return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }
async function chercherDrive(nom, parent, dossier){
  var c = "name = '" + echapper(nom) + "' and trashed = false" + (parent ? " and '" + parent + "' in parents" : "") +
    (dossier ? " and mimeType = 'application/vnd.google-apps.folder'" : "");
  var r = await (await apiDrive(API_DRIVE + "?q=" + encodeURIComponent(c) + "&spaces=drive&pageSize=10&orderBy=modifiedTime desc&fields=files(id,name,version,modifiedTime)")).json();
  return (r.files || [])[0] || null;
}
async function dossierDrive(nom, parent){
  var f = await chercherDrive(nom, parent, true); if(f) return f.id;
  var corps = {name: nom, mimeType: "application/vnd.google-apps.folder"}; if(parent) corps.parents = [parent];
  return (await (await apiDrive(API_DRIVE + "?fields=id", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corps)})).json()).id;
}
async function creerFichierDrive(nom, parent, contenu, type){
  var b = "bfc" + Date.now().toString(36), meta = JSON.stringify({name: nom, parents: [parent], mimeType: type});
  var corps = new Blob(["--" + b + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + meta + "\r\n--" + b + "\r\nContent-Type: " + type + "\r\n\r\n", contenu, "\r\n--" + b + "--\r\n"]);
  return (await apiDrive(UPLOAD_DRIVE + "?uploadType=multipart&fields=id,version,modifiedTime", {method: "POST", headers: {"Content-Type": "multipart/related; boundary=" + b}, body: corps})).json();
}
async function majFichierDrive(id, contenu, type){
  return (await apiDrive(UPLOAD_DRIVE + "/" + id + "?uploadType=media&fields=id,version,modifiedTime", {method: "PATCH", headers: {"Content-Type": type}, body: contenu})).json();
}
async function ecrireDrive(nom, parent, contenu, type){
  var f = await chercherDrive(nom, parent, false);
  return f ? majFichierDrive(f.id, contenu, type) : creerFichierDrive(nom, parent, contenu, type);
}
async function metaDrive(id){ return (await apiDrive(API_DRIVE + "/" + id + "?fields=id,version,modifiedTime,trashed")).json(); }
async function lireDrive(id){ return (await apiDrive(API_DRIVE + "/" + id + "?alt=media")).text(); }

/* ---------- Ouverture : lecture des données sur Drive ---------- */
async function connecterDrive(){
  DRIVE.etat = "connexion"; DRIVE.erreur = null; majSauvegarde(); rendreSiConnexion();
  try{
    if(!clientJeton) await chargerGis();
    if(!jetonValide()) await demanderJeton();
    await ouvrirDonneesDrive();
  }catch(e){
    DRIVE.erreur = e.message || String(e);
    DRIVE.etat = jetonValide() ? "erreur" : "deconnecte";
    majSauvegarde(); rendreSiConnexion();
    if(D) toast(DRIVE.erreur);
  }
}
async function ouvrirDonneesDrive(){
  var a = await (await apiDrive("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)")).json();
  if(DRIVE.email && a.user.emailAddress !== DRIVE.email && D){
    // autre compte que d'habitude : on repart de ce compte, sans mélanger les données
    D = null; DRIVE.fichierId = null; DRIVE.version = null; DRIVE.enAttente = false;
  }
  DRIVE.email = a.user.emailAddress; DRIVE.accueil = false;
  DRIVE.dossierId = await dossierDrive(NOM_DOSSIER, null);
  var f = await chercherDrive(NOM_DONNEES, DRIVE.dossierId, false);
  if(!f){
    DRIVE.fichierId = null; DRIVE.version = null; memoriserDrive();
    if(D && DRIVE.enAttente){ await envoyerToutDeSuite(true); rendre(); return; }   // données de cet appareil : on les envoie
    DRIVE.etat = "vide"; rendre(); return;                                          // première utilisation : import
  }
  DRIVE.fichierId = f.id;
  if(D && DRIVE.enAttente){
    if(DRIVE.version && f.version === DRIVE.version){ await envoyerToutDeSuite(true); rendre(); return; }
    conflitDrive(f); return;
  }
  await rechargerDepuisDrive(f);
}
async function rechargerDepuisDrive(f){
  var txt = await lireDrive(f.id);
  D = migrer(JSON.parse(txt)); ecrireCache();
  DRIVE.version = f.version; DRIVE.enAttente = false; DRIVE.etat = "ok"; DRIVE.derniere = Date.now(); DRIVE.erreur = null;
  memoriserDrive(); rendre();
}

/* ---------- Enregistrement : après chaque modification ---------- */
function planifierDrive(){
  DRIVE.enAttente = true; memoriserDrive();
  clearTimeout(tDrive); tDrive = setTimeout(function(){ envoyerToutDeSuite(false); }, 1500);
}
async function envoyerToutDeSuite(force){
  if(!D) return;
  if(envoiEnCours){ clearTimeout(tDrive); tDrive = setTimeout(function(){ envoyerToutDeSuite(force); }, 1200); return; }
  if(!navigator.onLine){ DRIVE.etat = "hors_ligne"; majSauvegarde(); return; }
  if(!jetonValide()){ DRIVE.etat = "reconnexion"; majSauvegarde(); return; }
  envoiEnCours = true; DRIVE.etat = "envoi"; majSauvegarde();
  var majEnvoyee = D.maj;
  try{
    var json = JSON.stringify(D), r;
    if(!DRIVE.dossierId) DRIVE.dossierId = await dossierDrive(NOM_DOSSIER, null);
    if(!DRIVE.fichierId){ r = await creerFichierDrive(NOM_DONNEES, DRIVE.dossierId, json, "application/json"); DRIVE.fichierId = r.id; }
    else {
      if(!force){
        var m = await metaDrive(DRIVE.fichierId);
        if(m.trashed){ throw new Error("Le fichier de données a été mis à la corbeille dans Google Drive : restaure-le depuis la corbeille."); }
        if(DRIVE.version && m.version !== DRIVE.version){ envoiEnCours = false; conflitDrive(m); return; }
      }
      r = await majFichierDrive(DRIVE.fichierId, json, "application/json");
    }
    DRIVE.version = r.version; DRIVE.derniere = Date.now(); DRIVE.erreur = null; DRIVE.etat = "ok";
    DRIVE.enAttente = D.maj !== majEnvoyee;          // modifié pendant l'envoi : on recommencera
    memoriserDrive();
    copieDuJour(json);
  }catch(e){
    DRIVE.erreur = e.message || String(e);
    DRIVE.etat = e.connexion ? "reconnexion" : (navigator.onLine ? "erreur" : "hors_ligne");
  }
  envoiEnCours = false; majSauvegarde();
  if(DRIVE.enAttente && DRIVE.etat === "ok") planifierDrive();
}
async function copieDuJour(json){
  if(DRIVE.copieJour === aujourdhui()) return;
  try{
    var h = await dossierDrive("Historique des sauvegardes", DRIVE.dossierId);
    await ecrireDrive("sauvegarde " + aujourdhui() + ".json", h, json, "application/json");
    DRIVE.copieJour = aujourdhui(); memoriserDrive();
  }catch(e){}
}
async function archiverPdfDrive(f, blob){
  if(!jetonValide() || !navigator.onLine) return false;
  try{
    if(!DRIVE.dossierId) DRIVE.dossierId = await dossierDrive(NOM_DOSSIER, null);
    var d = await dossierDrive("Factures PDF", DRIVE.dossierId);
    d = await dossierDrive(f.mois.slice(0, 4), d);
    await ecrireDrive(nomFichier(f) + ".pdf", d, blob, "application/pdf");
    return true;
  }catch(e){ return false; }
}

/* ---------- Conflit : modifié sur deux appareils ---------- */
function conflitDrive(meta){
  DRIVE.etat = "conflit"; majSauvegarde();
  ouvrirModal('<h2>Modifié sur un autre appareil</h2><p>Tes données ont été modifiées sur un autre appareil (téléphone ou ordinateur), et cet appareil a aussi des modifications pas encore enregistrées dans Google Drive.</p>' +
    '<p><b>Version de Google Drive :</b> modifiée le ' + esc(dateFr(String(meta.modifiedTime || "").slice(0, 10))) + ' à ' + esc(String(meta.modifiedTime || "").slice(11, 16)) + ' (heure universelle).<br><b>Version de cet appareil :</b> modifiée ' + (D && D.maj ? heureCourte(D.maj) : "récemment") + '.</p>' +
    '<p>Choisis celle à garder. L’autre sera remplacée.</p>' +
    '<div class="modal-acts"><button class="btn" id="cf-local">Garder celle de cet appareil</button><button class="btn pri" id="cf-drive">Prendre celle de Google Drive</button></div>');
  $("cf-drive").onclick = async function(){ fermerModal(); try{ await rechargerDepuisDrive(await metaDrive(DRIVE.fichierId)); toast("Données de Google Drive chargées"); }catch(e){ toast(e.message); } };
  $("cf-local").onclick = async function(){ fermerModal(); await envoyerToutDeSuite(true); rendre(); toast("Données de cet appareil enregistrées dans Google Drive"); };
}

/* Avant d'émettre une facture : être sûr d'avoir la dernière version (numérotation sans doublon) */
async function pretPourEmettre(){
  if(!DATA.enLigne) return true;
  if(!navigator.onLine){ toast("Connecte-toi à Internet pour émettre une facture : le numéro doit être vérifié dans Google Drive"); return false; }
  if(!jetonValide()){ toast("Reconnecte-toi à Google (en haut à droite) avant d’émettre"); DRIVE.etat = "reconnexion"; majSauvegarde(); return false; }
  try{
    if(!DRIVE.fichierId) return true;
    var m = await metaDrive(DRIVE.fichierId);
    if(DRIVE.version && m.version !== DRIVE.version){
      if(DRIVE.enAttente){ conflitDrive(m); return false; }
      await rechargerDepuisDrive(m);
      toast("Des changements faits sur ton autre appareil viennent d’être chargés : vérifie la facture, puis émets-la");
      return false;
    }
    if(DRIVE.enAttente) await envoyerToutDeSuite(true);
    return true;
  }catch(e){ toast(e.message); return false; }
}

/* ---------- Affichage de l'état ---------- */
function majEtatDrive(el){
  var h = "", cl = "etat";
  switch(DRIVE.etat){
    case "ok": h = "Google Drive : enregistré " + heureCourte(DRIVE.derniere || Date.now()); break;
    case "envoi": h = "Enregistrement dans Google Drive..."; break;
    case "connexion": h = "Connexion à Google..."; break;
    case "hors_ligne": h = "Hors ligne : gardé sur cet appareil"; cl += " alerte"; break;
    case "conflit": h = '<button class="lien" style="font-size:12.5px;color:var(--err);font-weight:700" data-act="drive-connecter">Modifié sur un autre appareil : choisir</button>'; break;
    case "erreur": h = '<button class="lien" style="font-size:12.5px;color:var(--err);font-weight:700" data-act="drive-reessayer" title="' + esc(DRIVE.erreur || "") + '">Erreur Google Drive : réessayer</button>'; break;
    default: h = '<button class="lien" style="font-size:12.5px;color:var(--warn);font-weight:700" data-act="drive-connecter">' + (DRIVE.enAttente ? "Non enregistré : se reconnecter à Google" : "Se connecter à Google") + '</button>';
  }
  el.className = cl; el.innerHTML = h;
}
function rendreSiConnexion(){ if(!D || DRIVE.accueil || DRIVE.etat === "vide") rendre(); }

ACTIONS["drive-connecter"] = function(){ connecterDrive(); };
ACTIONS["drive-reessayer"] = function(){ if(jetonValide()) envoyerToutDeSuite(false); else connecterDrive(); };
ACTIONS["drive-deconnecter"] = function(){
  confirmer("Se déconnecter de Google ?", "Les données restent dans ton Google Drive. Sur cet appareil, il faudra te reconnecter pour les modifier.", "Se déconnecter", function(){
    try{ if(DRIVE.token && window.google) google.accounts.oauth2.revoke(DRIVE.token, function(){}); }catch(e){}
    DRIVE.token = null; memoriserJeton(); DRIVE.etat = "deconnecte"; majSauvegarde(); rendre();
  });
};
ACTIONS["drive-importer"] = function(){ $("f-import").value = ""; $("f-import").click(); };
ACTIONS["drive-continuer"] = function(){ DRIVE.accueil = false; DRIVE.etat = "deconnecte"; DRIVE.erreur = null; rendre(); };

/* Retour sur l'application (autre onglet, téléphone déverrouillé) : charger ce qui a été fait ailleurs */
async function verifierDrive(){
  if(!D || !DRIVE.fichierId || !jetonValide() || envoiEnCours || !navigator.onLine || DRIVE.etat === "conflit") return;
  try{
    var m = await metaDrive(DRIVE.fichierId);
    if(!DRIVE.version || m.version === DRIVE.version) return;
    if(DRIVE.enAttente){ conflitDrive(m); return; }
    await rechargerDepuisDrive(m);
    toast("Données mises à jour depuis ton autre appareil");
  }catch(e){ if(e.connexion){ DRIVE.etat = "reconnexion"; majSauvegarde(); } }
}

/* Écran de connexion (pas encore de données sur cet appareil) et de première importation */

  var h = '<div class="page etroite" style="padding-top:20px"><div class="bloc" style="padding:34px 32px"><img src="' + DATA.logo + '" alt="BF Conseil" style="width:120px;display:block;margin-bottom:22px;filter:brightness(1.04)">';
  h += '<div class="kick">Facturation BF Conseil</div>';

    h += '<h1 class="p-titre">Première utilisation</h1><p class="p-sous">Tu es connecté avec <b>' + esc(DRIVE.email) + '</b>. Il n’y a pas encore de données dans ton Google Drive : importe celles de ta version sur ordinateur.</p>' +
      '<ol style="font-size:15px;color:var(--ink2);margin:0 0 18px 18px;line-height:1.7"><li>Sur ton ordinateur, ouvre l’ancienne version (fichier « Facturation BF Conseil.html »).</li><li>Clique sur <b>« Sauvegarder »</b>, en haut à droite : un fichier .json est téléchargé.</li><li>Ici, clique sur <b>« Importer mes données »</b> et choisis ce fichier.</li></ol>' +
      '<button class="btn pri" data-act="drive-importer">' + ICO.telecharger + ' Importer mes données</button>';
  } else {
    h += '<h1 class="p-titre">Connexion</h1><p class="p-sous">Connecte-toi avec ton compte Google BF Conseil pour retrouver ton planning et tes factures, sur ton ordinateur comme sur ton téléphone.</p>';
    if(DRIVE.erreur) h += '<div class="enc erreur">' + esc(DRIVE.erreur) + '</div>';
    h += '<button class="btn pri" data-act="drive-connecter"' + (DRIVE.etat === "connexion" ? " disabled" : "") + '>' + (DRIVE.etat === "connexion" ? "Connexion en cours..." : "Se connecter avec Google") + '</button>';
    if(D) h += ' <button class="btn" data-act="drive-continuer">Continuer sans connexion</button>' +
      '<p class="aide" style="margin-top:12px">Sans connexion, tu vois les données gardées sur cet appareil' + (DRIVE.derniere ? ' (dernière mise à jour ' + esc(heureCourte(DRIVE.derniere)) + ')' : '') + '. Tes modifications seront envoyées dans Google Drive à ta prochaine connexion.</p>';
    h += '<p class="aide" style="margin-top:14px">Les données sont rangées dans ton Google Drive, dossier « ' + NOM_DOSSIER + ' ». L’application n’a accès qu’aux fichiers qu’elle a créés.</p>';
  }
  return h + '</div></div>';
};
function blocDrive(){
  var h = '<div class="bloc"><h2>Google Drive</h2>';
  if(jetonValide()) h += '<p style="font-size:14.5px"><span class="st st-payee">Connecté</span> ' + esc(DRIVE.email) + '</p>';
  else h += '<p style="font-size:14.5px"><span class="st st-brouillon">Déconnecté</span> ' + esc(DRIVE.email || "") + ' <button class="lien" data-act="drive-connecter">Se connecter</button></p>';
  h += '<p class="aide" style="margin-top:8px">Chaque modification est enregistrée dans « ' + NOM_DOSSIER + ' / ' + NOM_DONNEES + ' », avec une copie par jour dans « Historique des sauvegardes ». Les PDF émis sont rangés dans « Factures PDF ». ' +
    (DRIVE.derniere ? 'Dernier enregistrement : ' + heureCourte(DRIVE.derniere) + '.' : '') + '</p>';
  if(DRIVE.erreur) h += '<div class="enc erreur" style="margin-top:10px">' + esc(DRIVE.erreur) + '</div>';
  return h + (jetonValide() ? '<button class="lien danger" style="margin-top:10px" data-act="drive-deconnecter">Se déconnecter de Google sur cet appareil</button>' : '') + '</div>';
}

function initDrive(){
  relireDrive(); relireJeton();
  window.addEventListener("online", function(){ if(DRIVE.enAttente && jetonValide()) envoyerToutDeSuite(false); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") verifierDrive();
    else {                                                     // on quitte l'appli (téléphone) : envoyer sans attendre
      if(tSauv){ clearTimeout(tSauv); tSauv = null; sauver(true); }
      if(DRIVE.enAttente && jetonValide() && D){ clearTimeout(tDrive); envoyerToutDeSuite(false); }
    }
  });
  if(!DATA.google || !DATA.google.clientId){ DRIVE.etat = "erreur"; DRIVE.erreur = "Identifiant Google manquant dans la configuration."; majSauvegarde(); rendre(); return; }
  chargerGis().then(preparerClient).catch(function(){});   // prépare la connexion (un clic reste nécessaire)
  if(jetonValide()){ connecterDrive(); return; }             // onglet rechargé : déjà connecté
  DRIVE.etat = D && DRIVE.enAttente ? "reconnexion" : "deconnecte";
  DRIVE.accueil = !!D;                                        // ouverture : se connecter d'abord pour avoir les dernières données
  majSauvegarde(); rendre();
}
